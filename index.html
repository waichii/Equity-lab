<style>
/* Layout: single study column; cards first, verdict right under them, range + sizing below. Suits use a 4-colour deck. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#14201C; --muted:#5A6A64; --line:#D2DBD7;
  --accent:#0E6B57; --accent-soft:#D5EAE3; --accent-ink:#FFFFFF;
  --good:#1D7A3E; --good-soft:#DCF0E2; --bad:#B3261E; --bad-soft:#F7DEDB; --tie:#9AA8A2;
  --face:#FFFFFF; --face-line:#C9D2CE;
  --spade:#1A1F1D; --heart:#C62828; --diamond:#1F5FBF; --club:#1E7B3A;
  --cell-pair:#E4E9E7; --cell-s:#EEF2F0; --cell-o:#F6F8F7;
  --t1:#0E6B57; --t2:#6FB3A2; --t3:#C98A1B; --t4:#BFC9C5;
  --f-display:"Bricolage Grotesque","PingFang HK","Noto Sans HK",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --ink:#E3EBE7; --muted:#93A39C; --line:#2B3632;
  --accent:#4FC3A1; --accent-soft:#1D3A31; --accent-ink:#06211A;
  --good:#5BD38A; --good-soft:#163323; --bad:#FF7F73; --bad-soft:#3A1D1A; --tie:#5E6D67;
  --face:#F1F3F0; --face-line:#F1F3F0;
  --cell-pair:#26302C; --cell-s:#1F2825; --cell-o:#1B2421; --t1:#4FC3A1; --t2:#2E7D69; --t3:#E0A43A; --t4:#3D4A45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --ink:#E3EBE7; --muted:#93A39C; --line:#2B3632;
  --accent:#4FC3A1; --accent-soft:#1D3A31; --accent-ink:#06211A;
  --good:#5BD38A; --good-soft:#163323; --bad:#FF7F73; --bad-soft:#3A1D1A; --tie:#5E6D67;
  --face:#F1F3F0; --face-line:#F1F3F0;
  --cell-pair:#26302C; --cell-s:#1F2825; --cell-o:#1B2421; --t1:#4FC3A1; --t2:#2E7D69; --t3:#E0A43A; --t4:#3D4A45; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{font:600 15px var(--f-body);border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.label span{text-transform:none;letter-spacing:0;font-weight:400}

.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:50px;height:68px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--muted);font:500 11px var(--f-body)}
.slot.filled{border:0}
.slot.active{border:2px solid var(--accent);border-style:solid}
.slot.filled.active{outline:2px solid var(--accent);outline-offset:2px}
.gapper{width:6px}
.card{width:100%;height:100%;border-radius:8px;background:var(--face);border:1px solid var(--face-line);display:flex;flex-direction:column;align-items:flex-start;padding:4px 6px;font-family:var(--f-mono);line-height:1}
.card b{font-size:20px;font-weight:700}
.card i{font-style:normal;font-size:22px;margin-top:auto;align-self:flex-end}
.c0{color:var(--spade)}.c1{color:var(--heart)}.c2{color:var(--diamond)}.c3{color:var(--club)}

.picker{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.pk{aspect-ratio:.78;border-radius:5px;border:1px solid var(--face-line);background:var(--face);font:700 12px var(--f-mono);padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pk small{font-size:11px}
.pk:disabled{opacity:.18;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .num{font-family:var(--f-mono);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .cap{color:var(--muted);font-size:13px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar .w{background:var(--good)}.bar .t{background:var(--tie)}.bar .l{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.made{font-size:14px}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;font-size:14px}
.verdict.good{background:var(--good-soft)}.verdict.bad{background:var(--bad-soft)}
.chip{font:700 13px var(--f-body);padding:3px 10px;border-radius:999px;color:var(--surface)}
.good .chip{background:var(--good)}.bad .chip{background:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv dt{color:var(--muted)}
.msg{color:var(--muted);font-size:14px}

.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inputs input{font:500 16px var(--f-mono);padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}

.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}
.cell{aspect-ratio:1;border:0;border-radius:3px;font:600 9px var(--f-mono);padding:0;cursor:pointer;color:var(--muted);letter-spacing:-.03em;
  background:color-mix(in srgb,var(--accent) calc(var(--w,0)*100%),var(--base))}
.cell.p{--base:var(--cell-pair)}.cell.s{--base:var(--cell-s)}.cell.o{--base:var(--cell-o)}
.cell.hi{color:var(--accent-ink)}
.gsteps{display:flex;flex-direction:column;gap:8px}
.gstep{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:center}
.gstep>span{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cb{font:600 13px var(--f-body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cb:disabled{opacity:.35;cursor:default}
.hint{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:8px 11px;line-height:1.55}
.hint p{margin:0}.hint p+p{margin-top:4px}
.hr{height:1px;background:var(--line)}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.mix div{height:100%}
.k1{background:var(--t1)}.k2{background:var(--t2)}.k3{background:var(--t3)}.k4{background:var(--t4)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
@media (min-width:430px){.cell{font-size:10px}}

.quizcards{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quizcards .slot{cursor:default}
.slider{display:flex;flex-direction:column;gap:6px}
.slider input{width:100%;accent-color:var(--accent)}
.guess{font:700 32px var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 20px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding-top:4px}
@media (prefers-reduced-motion:no-preference){.bar div{transition:width .3s ease}}

<div class="app">
  <header>
    <div>
      <h1>Equity 練習簿</h1>
      <p class="sub">打完牌之後 review，同埋練習估 equity 同 pot odds</p>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabCalc" role="tab" aria-selected="true">計算</button>
      <button id="tabQuiz" role="tab" aria-selected="false">練習</button>
    </div>
  </header>

  <section id="calc" style="display:flex;flex-direction:column;gap:14px">
    <div class="panel">
      <div class="label">你嘅手牌</div>
      <div class="slots" id="heroSlots"></div>
      <div class="label">公共牌 <span>Flop · Turn · River</span></div>
      <div class="slots" id="boardSlots"></div>
      <div class="picker" id="picker" aria-label="揀牌"></div>
      <div class="row">
        <button class="btn" id="clearBtn">清除牌</button>
        <button class="btn" id="sampleBtn">載入例子</button>
      </div>
    </div>

    <div class="panel" id="result" aria-live="polite"></div>

    <div class="panel">
      <div class="label">對手落注，你跟唔跟？</div>
      <div class="inputs">
        <label for="potIn">Pot（包括對手嘅注）<input id="potIn" type="number" inputmode="decimal" min="0" step="0.01" value="1.71"></label>
        <label for="callIn">要跟幾多<input id="callIn" type="number" inputmode="decimal" min="0" step="0.01" value="0.56"></label>
      </div>
    </div>

    <div class="panel">
      <div class="label">你想 bet 或者 bluff？ <span>對手 check 俾你嗰陣用</span></div>
      <div class="inputs">
        <label for="bpotIn">而家 pot<input id="bpotIn" type="number" inputmode="decimal" min="0" step="0.01" value="0.59"></label>
        <label for="betIn">你想 bet 幾多<input id="betIn" type="number" inputmode="decimal" min="0" step="0.01" value="0.56"></label>
      </div>
      <div id="betOut" aria-live="polite" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div class="panel">
      <div class="label">對手 range <span id="rangeInfo"></span></div>
      <div class="chips" id="oppRow"></div>
      <div class="gsteps" id="guide"></div>
      <div class="hint" id="hint"></div>
      <div id="makeup"></div>
      <div class="hr"></div>
      <div class="label">手動調整 <span>撳格加減手牌類別</span></div>
      <div class="row" id="presets"></div>
      <div class="grid" id="grid"></div>
      <div class="msg">顏色越深，代表嗰類手牌留喺 range 嘅比例越高。各個位置嘅 range 同收窄比例都係大約估計，用嚟幫你諗，唔係 solver 結果。</div>
    </div>
  </section>

  <section id="quiz" hidden style="flex-direction:column;gap:14px">
    <div class="panel">
      <div class="stats">
        <div class="stat"><b id="stN">0</b><span>題數</span></div>
        <div class="stat"><b id="stC">–</b><span>決定正確</span></div>
        <div class="stat"><b id="stE">–</b><span>平均誤差</span></div>
      </div>
    </div>
    <div class="panel" id="qPanel"></div>
    <div class="row"><button class="btn" id="resetStats">重設紀錄</button></div>
  </section>

  <footer>所有建議都係簡化模型：call 只按 pot odds 計，bet 只睇呢一條街。未計 implied odds 同之後幾條街嘅行動。</footer>
</div>

<script>
/* ===== engine ===== */
const RANKS="23456789TJQKA", SYM=["♠","♥","♦","♣"];
const rl=r=>r===8?"10":RANKS[r];
const CAT=["高牌","一對","兩對","三條","順子","同花","葫蘆","四條","同花順"];
function straightHigh(mask){const m2=(mask<<1)|((mask>>12)&1);for(let t=13;t>=4;t--){if(((m2>>(t-4))&31)===31)return t}return -1}
function enc(cat,a){let v=cat;for(let i=0;i<5;i++)v=v*16+(a[i]===undefined?0:a[i]+1);return v}
function evalHand(cs){
  const cnt=new Int8Array(13),sc=[0,0,0,0],sm=[0,0,0,0];let m=0;
  for(let i=0;i<cs.length;i++){const c=cs[i],r=c>>2,s=c&3;cnt[r]++;sc[s]++;sm[s]|=1<<r;m|=1<<r}
  for(let s=0;s<4;s++)if(sc[s]>=5){const st=straightHigh(sm[s]);if(st>=0)return enc(8,[st]);
    const a=[];for(let r=12;r>=0&&a.length<5;r--)if(sm[s]&(1<<r))a.push(r);return enc(5,a)}
  const q=[],t=[],p=[];for(let r=12;r>=0;r--){if(cnt[r]===4)q.push(r);else if(cnt[r]===3)t.push(r);else if(cnt[r]===2)p.push(r)}
  const others=(ex,n)=>{const a=[];for(let r=12;r>=0&&a.length<n;r--)if(cnt[r]&&!ex.includes(r))a.push(r);return a};
  if(q.length)return enc(7,[q[0],...others([q[0]],1)]);
  if(t.length&&(t.length>1||p.length)){const sec=Math.max(t.length>1?t[1]:-1,p.length?p[0]:-1);return enc(6,[t[0],sec])}
  const st=straightHigh(m);if(st>=0)return enc(4,[st]);
  if(t.length)return enc(3,[t[0],...others([t[0]],2)]);
  if(p.length>=2)return enc(2,[p[0],p[1],...others([p[0],p[1]],1)]);
  if(p.length)return enc(1,[p[0],...others([p[0]],3)]);
  return enc(0,others([],5));
}
const catOf=v=>Math.floor(v/1048576);
/* combos: [cardA, cardB, weight, classKey] */
function equity(hero,board,combos,iters){
  const known=new Set([...hero,...board]);const deck=[];for(let c=0;c<52;c++)if(!known.has(c))deck.push(c);
  const need=5-board.length;let w=0,t=0,l=0,curV,curW;
  const H=hero.concat(board),V=board.slice();
  const score=run=>{const h=evalHand(H.concat(run)),v=evalHand(run.concat(V,curV));if(h>v)w+=curW;else if(h===v)t+=curW;else l+=curW};
  if(need<=1){
    for(const vc of combos){curV=[vc[0],vc[1]];curW=vc[2];if(curW<=0)continue;
      if(need===0)score([]);else for(const c of deck){if(c!==vc[0]&&c!==vc[1])score([c])}}
    return{w,t,l,n:w+t+l,exact:true,sims:0};
  }
  const cum=[];let tot=0;for(const vc of combos){tot+=vc[2];cum.push(tot)}
  const pickV=()=>{const x=Math.random()*tot;let lo=0,hi=cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]>x)hi=m;else lo=m+1}return combos[lo]};
  const run=new Array(need);curW=1;
  for(let it=0;it<iters;it++){
    const vc=pickV();curV=[vc[0],vc[1]];
    let k=0;while(k<need){const c=deck[(Math.random()*deck.length)|0];
      if(c===curV[0]||c===curV[1])continue;let dup=false;for(let j=0;j<k;j++)if(run[j]===c){dup=true;break}
      if(!dup)run[k++]=c}
    score(run.slice());
  }
  return{w,t,l,n:w+t+l,exact:false,sims:iters};
}
/* multiway Monte Carlo: lists = one weighted combo list per opponent */
function equityMulti(hero,board,lists,iters){
  const known=new Set([...hero,...board]);const deck=[];for(let c=0;c<52;c++)if(!known.has(c))deck.push(c);
  const need=5-board.length,H=hero.concat(board);
  const cums=lists.map(cs=>{const a=[];let t=0;for(const c of cs){t+=c[2];a.push(t)}return{a,t,cs}});
  const pick=k=>{const{a,t,cs}=cums[k],x=Math.random()*t;let lo=0,hi=a.length-1;while(lo<hi){const m=(lo+hi)>>1;if(a[m]>x)hi=m;else lo=m+1}return cs[lo]};
  let w=0,t=0,l=0,eq=0,n=0;
  for(let it=0;it<iters;it++){
    const used=new Set(),opp=[];let ok=true;
    for(let k=0;k<lists.length;k++){let c,tries=0;do{c=pick(k);tries++}while((used.has(c[0])||used.has(c[1]))&&tries<40);
      if(used.has(c[0])||used.has(c[1])){ok=false;break}used.add(c[0]);used.add(c[1]);opp.push(c)}
    if(!ok)continue;
    const run=[];while(run.length<need){const c=deck[(Math.random()*deck.length)|0];if(!used.has(c)&&!run.includes(c))run.push(c)}
    const hv=evalHand(H.concat(run));let beaten=false,ties=0;
    for(const o of opp){const v=evalHand([o[0],o[1],...board,...run]);if(v>hv){beaten=true;break}if(v===hv)ties++}
    n++;if(beaten)l++;else if(ties){t++;eq+=1/(ties+1)}else{w++;eq+=1}
  }
  return{w,t,l,n,eq:eq/n,exact:false,sims:n};
}
/* hand classes */
const CLASSES=[];
(function(){const pts=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  for(let i=12;i>=0;i--)for(let j=12;j>=0;j--){
    let hi,lo,type;if(i===j){hi=lo=i;type="p"}else if(i>j){hi=i;lo=j;type="s"}else{hi=j;lo=i;type="o"}
    const key=RANKS[hi]+RANKS[lo]+(type==="p"?"":type);
    let s=pts(hi);
    if(type==="p")s=Math.max(5,s*2);else{if(type==="s")s+=2;const g=hi-lo-1;s-=g===0?0:g===1?1:g===2?2:g===3?4:5;if(g<=1&&hi<10)s+=1;s=Math.ceil(s)}
    CLASSES.push({key,hi,lo,type,row:12-i,col:12-j,score:s,n:type==="p"?6:type==="s"?4:12});
  }})();
const ORDER=CLASSES.slice().sort((a,b)=>b.score-a.score||(b.type==="p")-(a.type==="p")||b.hi-a.hi||b.lo-a.lo||(a.type==="s"?-1:1));
function topPct(p){const s=new Set();let cum=0;const target=p*1326/100;for(const c of ORDER){if(cum>=target)break;s.add(c.key);cum+=c.n}return s}
function combosIn(set){let n=0;for(const c of CLASSES)if(set.has(c.key))n+=c.n;return n}
function expand(set,dead){const out=[];for(const c of CLASSES){if(!set.has(c.key))continue;
  for(let a=0;a<4;a++)for(let b=0;b<4;b++){
    if(c.type==="p"&&b<=a)continue;if(c.type==="s"&&a!==b)continue;if(c.type==="o"&&a===b)continue;

  else if(v==="del"){opps.splice(cur,1);loadCur(Math.max(0,cur-1))}
  else loadCur(+v);
  schedule();
});
$("guide").addEventListener("click",e=>{
  const b=e.target.closest(".cb");if(!b||b.disabled)return;const g=b.dataset.g,v=b.dataset.v;
  if(g==="bluff"||g==="fold"){guide[g]=v;schedule();return}
  if(g.startsWith("post")){const L=+g.slice(4);post[L]=post[L]===v?null:v;schedule();return}
  if(guide.custom){guide.custom=false}
  guide[g]=v;
  normGuide(guide);
  range=baseFor(guide.pos,guide.act,guide.type,guide.vs);schedule();
});

/* build weighted combos for the calc tab */
function combosFor(o,board,dead){
  const combos=expand(o.range,dead);
  for(const L of [3,4,5]){if(!o.post[L]||board.length<L)continue;const bd=board.slice(0,L);
    for(const c of combos)c[2]*=wAdj(o.post[L],tierOf(c,bd),o.guide)}
  return combos;
}
function buildCombos(){
  saveCur();
  const board=boardNow(),hero=slots.slice(0,2).filter(x=>x!=null),dead=new Set([...hero,...board]);
  const alls=opps.map(o=>combosFor(o,board,dead)),lists=alls.map(a=>a.filter(c=>c[2]>0.001));
  return{combos:lists[cur],all:alls[cur],lists,board,hero,dead};
}

const PRESETS=[["全部",100],["50%",50],["30%",30],["15%",15],["7%",7]];
$("presets").innerHTML=PRESETS.map(([n,p])=>`<button class="btn" data-p="${p}">${n}</button>`).join("")+`<button class="btn" data-p="0">清空</button>`;
$("presets").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;const p=+b.dataset.p;range=p?topPct(p):new Set();guide.custom=true;schedule()};
function renderGrid(all,dead){
  const sum={},cnt={};for(const c of all){sum[c[3]]=(sum[c[3]]||0)+c[2];cnt[c[3]]=(cnt[c[3]]||0)+1}
  const cells=CLASSES.slice().sort((a,b)=>a.row-b.row||a.col-b.col);
  $("grid").innerHTML=cells.map(c=>{const w=cnt[c.key]?sum[c.key]/cnt[c.key]:(range.has(c.key)?1:0);
    return `<button class="cell ${c.type}${w>.5?" hi":""}" style="--w:${w.toFixed(2)}" data-k="${c.key}" aria-pressed="${range.has(c.key)}">${c.key}</button>`}).join("");
  let n=0;for(const c of all)n+=c[2];
  $("rangeInfo").textContent=`≈${Math.round(n)} 個組合 · ${(n/1326*100).toFixed(1)}%`;
}
$("grid").onclick=e=>{const b=e.target.closest(".cell");if(!b)return;const k=b.dataset.k;range=new Set(range);range.has(k)?range.delete(k):range.add(k);guide.custom=true;schedule()};
function renderMakeup(combos,board){
  if(board.length<3||!combos.length){$("makeup").innerHTML="";return}
  const g=[0,0,0,0];let tot=0;for(const c of combos){g[GROUP[tierOf(c,board)]]+=c[2];tot+=c[2]}
  const names=["強牌（top pair 以上）","中等牌（其他 pair）","Draw","冇嘢／高張"];
  $("makeup").innerHTML=`<div class="label" style="margin-bottom:6px">而家對手 range 嘅組成</div>
  <div class="mix">${g.map((x,i)=>`<div class="k${i+1}" style="width:${x/tot*100}%"></div>`).join("")}</div>
  <div class="legend" style="margin-top:6px">${g.map((x,i)=>`<span><i class="dot k${i+1}"></i>${names[i]} <b>${(x/tot*100).toFixed(0)}%</b></span>`).join("")}</div>`;
}

function schedule(){clearTimeout(timer);saveCur();renderGuide();$("result").innerHTML='<div class="msg">計算中…</div>';timer=setTimeout(compute,40)}
function compute(){
  const R=$("result"),{combos,all,lists,board,hero,dead}=buildCombos();$("betOut").innerHTML="";
  renderGrid(all,dead);renderMakeup(combos,board);
  if(hero.length<2){R.innerHTML='<div class="msg">揀你兩張手牌開始。</div>';return}
  if(board.length===1||board.length===2){R.innerHTML='<div class="msg">公共牌要 0、3、4 或 5 張。</div>';return}
  const empty=lists.findIndex(x=>!x.length);
  if(empty>=0){R.innerHTML=`<div class="msg">對手 ${empty+1} 嘅 range 入面冇手牌。揀返位置，或者喺格度加啲手牌。</div>`;return}
  const multi=lists.length>1;
  const r=multi?equityMulti(hero,board,lists,30000):equity(hero,board,combos,30000),eq=multi?r.eq:(r.w+r.t/2)/r.n;
  const pot=parseFloat($("potIn").value)||0,call=parseFloat($("callIn").value)||0;
  let made="";if(board.length>=3)made=`<div class="made">你而家：<b>${CAT[catOf(evalHand(hero.concat(board)))]}</b></div>`;
  let pv="";
  if(call>0){const req=call/(pot+call),ev=eq*(pot+call)-call,ok=eq>=req;
    pv=`<dl class="kv"><dt>需要 equity</dt><dd>${pct(req)}</dd><dt>Call 嘅 EV</dt><dd>${ev>=0?"+":""}${ev.toFixed(2)}</dd></dl>
    <div class="verdict ${ok?"good":"bad"}"><span class="chip">${ok?"Call +EV":"Fold"}</span><span>${ok?"Equity 高過 pot odds 要求":"Equity 唔夠 pot odds 要求"}</span></div>`}
  else pv='<div class="msg">輸入要跟嘅注碼就會計 pot odds。</div>';
  const mw=multi?`<div class="msg">多人底池：你要同時贏晒 ${lists.length} 個對手先算贏，所以 equity 會明顯低過單挑。</div>`:"";
  R.innerHTML=`<div class="label">你嘅 equity <span>對 ${lists.length} 個對手 · ${r.exact?"精確計算":"模擬 "+r.sims.toLocaleString()+" 次"}</span></div>
  <div class="big"><span class="num">${pct(eq)}</span></div>
  <div class="bar"><div class="w" style="width:${r.w/r.n*100}%"></div><div class="t" style="width:${r.t/r.n*100}%"></div><div class="l" style="width:${r.l/r.n*100}%"></div></div>
  <div class="legend"><span>贏 <b>${pct(r.w/r.n)}</b></span><span>和 <b>${pct(r.t/r.n)}</b></span><span>輸 <b>${pct(r.l/r.n)}</b></span></div>${mw}${made}${pv}`;
  renderBet(hero,board,lists,eq);
}

function betKind(eqC,board){if(eqC==null)return"";if(eqC>=.5)return"Value bet：俾人 call 你都多數贏。";
  if(eqC>=.25&&board.length<5)return"半 bluff：俾人 call 都仲有機會中牌。";return"純 bluff：主要靠對手 fold。"}
function renderBet(hero,board,lists,eqNow){
  const O=$("betOut"),pot=parseFloat($("bpotIn").value)||0,bet=parseFloat($("betIn").value)||0;
  if(board.length<3){O.innerHTML='<div class="msg">Bet 分析要有 flop 之後先用得到。</div>';return}
  if(!(pot>0&&bet>0)){O.innerHTML='<div class="msg">輸入而家 pot 同你想 bet 幾多。</div>';return}
  const b=betEval(hero,board,lists,opps.map(o=>o.guide),pot,bet,eqNow,20000),better=b.evBet>b.evCheck;
  O.innerHTML=`<dl class="kv"><dt>${lists.length>1?"全部對手 fold 嘅機會":"對手 fold 嘅機會"}</dt><dd>${pct(b.FE)}</dd>
  <dt>純 bluff 要幾多 fold 先唔蝕</dt><dd>${pct(b.be)}</dd>
  <dt>俾人 call 之後你嘅 equity</dt><dd>${b.eqC==null?"–":pct(b.eqC)}</dd>
  <dt>Bet 嘅 EV</dt><dd>${b.evBet>=0?"+":""}${b.evBet.toFixed(2)}</dd>
  <dt>Check 嘅 EV（當直接攤牌）</dt><dd>+${b.evCheck.toFixed(2)}</dd></dl>
  <div class="verdict ${better?"good":"bad"}"><span class="chip">${better?"Bet 較好":"Check 較好"}</span><span>${betKind(b.eqC,board)}</span></div>
  <div class="msg">Fold 機會係按對手 range 入面每類牌通常點反應估出嚟。Check 嘅 EV 當你免費攤牌，未計對手之後會唔會 bet。</div>`;
}
/* tabs */
function setTab(q){$("tabCalc").setAttribute("aria-selected",!q);$("tabQuiz").setAttribute("aria-selected",q);
  $("calc").hidden=q;$("calc").style.display=q?"none":"flex";$("quiz").hidden=!q;$("quiz").style.display=q?"flex":"none";if(q&&!Q)newQuiz()}
$("tabCalc").onclick=()=>setTab(false);$("tabQuiz").onclick=()=>setTab(true);

/* quiz */
let Q=null,stats={n:0,c:0,e:0,g:0};
try{const s=JSON.parse(localStorage.getItem("eqlab-stats")||"null");if(s&&typeof s.n==="number")stats={...s,g:s.g??s.n}}catch(e){}
const saveStats=()=>{try{localStorage.setItem("eqlab-stats",JSON.stringify(stats))}catch(e){}};
function renderStats(){$("stN").textContent=stats.n;$("stC").textContent=stats.n?Math.round(stats.c/stats.n*100)+"%":"–";$("stE").textContent=stats.g?"±"+(stats.e/stats.g).toFixed(1):"–"}
const pick=a=>a[(Math.random()*a.length)|0];
const SCEN=[["UTG","open"],["MP","open"],["CO","open"],["BTN","open"],["BTN","open"],["SB","open"],["BB","call","BTN"],["BB","call","CO"],["BB","call","SB"],["CO","call","MP"],["BTN","call","CO"],["BTN","threebet","CO"],["CO","call3b"],["MP","limp"]];
function newQuiz(){
  const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=(Math.random()*(i+1))|0;[d[i],d[j]]=[d[j],d[i]]}
  const hero=[d[0],d[1]],street=pick([3,3,4,4,5]),board=d.slice(2,2+street);
  const pot=Math.round(4+Math.random()*36),frac=pick([.33,.5,.5,.75,1]),bet=Math.max(1,Math.round(pot*frac*10)/10),big=frac>=.75;
  const roll=Math.random();
  if(roll<.25)return newPreQuiz();
  if(roll<.5)return newBluffQuiz(hero,board,pot);
  const nOpp=Math.random()<.3?2:1,dead=new Set([...hero,...board]),names=[],lists=[];
  let s1=pick(SCEN);
  for(let k=0;k<nOpp;k++){
    let sc=s1;if(k===1){const others=SCEN.filter(x=>x[0]!==s1[0]&&x[1]==="call");sc=pick(others.length?others:[["BB","call","BTN"]])}
    const set=baseFor(sc[0],sc[1],"normal",sc[2]),cs=expand(set,dead),W=WEIGHTS[k===0?(big?"big":"small"):(big?"callB":"callS")];
    for(const c of cs)c[2]*=W[tierOf(c,board)];lists.push(cs.filter(c=>c[2]>0.001));
    names.push(`${scenarioName(sc[0],sc[1],sc[2])}（約 ${Math.round(combosIn(set)/1326*100)}%）· ${k===0?"落注":"跟注"}`);
  }
  const r=nOpp>1?equityMulti(hero,board,lists,20000):equity(hero,board,lists[0],20000);
  const total=pot+bet*(nOpp+1);
  Q={hero,board,names,pot,bet,frac,callers:nOpp-1,total,eq:nOpp>1?r.eq:(r.w+r.t/2)/r.n,req:bet/total,answered:false,guess:50};
  renderQuiz();
}
/* preflop decision for the hero, graded against the same range tables */
function preAction(pos,vs,key){
  if(!vs)return parseRange(OPEN[pos]).has(key)?"raise":"fold";
  if(parseRange(THREEBET_VS[vs]).has(key))return"3bet";
  if(parseRange(rangeStr(pos,"call",vs)).has(key))return"call";
  return"fold"}
function newPreQuiz(){
  const rfi=Math.random()<.45;let pos,vs;
  if(rfi)pos=pick(["UTG","MP","CO","BTN","SB"]);else{pos=pick(["MP","CO","BTN","SB","BB","BB"]);vs=pick(vsOptions(pos))}
  const ref=rfi?parseRange(OPEN[pos]):new Set([...parseRange(THREEBET_VS[vs]),...parseRange(rangeStr(pos,"call",vs))]);
  const cutoff=Math.min(ORDER.length-1,ORDER.findIndex(c=>!ref.has(c.key)&&ORDER.indexOf(c)>20)+25);
  const cls=Math.random()<.8?ORDER[(Math.random()*Math.max(1,cutoff))|0]:pick(CLASSES);
  const sA=(Math.random()*4)|0;let sB=cls.type==="s"?sA:(sA+1+((Math.random()*3)|0))%4;
  const hero=[cls.hi*4+sA,cls.lo*4+sB];
  Q={kind:"pre",hero,pos,vs,key:cls.key,ans:null,answered:false,best:preAction(pos,vs,cls.key)};
  renderQuiz();
}
function chartHTML(pos,vs,hl){
  const cells=CLASSES.slice().sort((a,b)=>a.row-b.row||a.col-b.col);
  return `<div class="grid">${cells.map(c=>{const a=preAction(pos,vs,c.key),w=a==="fold"?0:a==="call"?.45:1;
    return `<span class="cell ${c.type}${w>.5?" hi":""}" style="--w:${w};${c.key===hl?"outline:2px solid var(--ink);outline-offset:-1px;":""}">${c.key}</span>`}).join("")}</div>`}
function renderPreQuiz(){
  const cards=a=>a.map(c=>`<span class="slot filled">${cardHTML(c)}</span>`).join("");
  const opts=Q.vs?[["fold","Fold"],["call","Call"],["3bet","3-bet"]]:[["fold","Fold"],["raise","Raise"]];
  const NAME={fold:"Fold",call:"Call",raise:"Raise","3bet":"3-bet"};
  let h=`<div class="label">Preflop 題 · 你嘅手牌</div><div class="quizcards">${cards(Q.hero)}</div>
  <dl class="kv"><dt>你嘅位置</dt><dd>${Q.pos}</dd><dt>前面</dt><dd>${Q.vs?Q.vs+" open raise，其他人 fold":"全部 fold 到你"}</dd></dl>`;
  if(!Q.answered){h+=`<div class="row">${opts.map(([v,n],i)=>`<button class="btn${i===opts.length-1?" primary":""}" data-a="${v}">${n}</button>`).join("")}</div>`}
  else{
    const ok=Q.ans===Q.best;
    const why=Q.vs?`${VS_NOTE[Q.vs]}。${Q.pos==="BB"?"BB 已經落咗 1bb，可以防守得闊啲。":Q.pos==="SB"?"SB 之後仲有 BB，又冇位置，所以多數唔 call，係 3-bet 或者 fold。":"你喺佢後面有位置，但後面仲有人，call 要揀可以打 postflop 嘅牌。"}`:POS_NOTE[Q.pos];
    h+=`<div class="verdict ${ok?"good":"bad"}"><span class="chip">${ok?"答啱":"答錯"}</span><span>參考答案：<b>${NAME[Q.best]}</b>，你揀咗 ${NAME[Q.ans]}</span></div>
    <div class="msg">${why}</div>
    <div class="label">呢個情況嘅參考 range <span>${Q.vs?"深色 3-bet · 淺色 call":"深色 raise"} · 框住係你手牌</span></div>${chartHTML(Q.pos,Q.vs,Q.key)}
    <div class="row"><button class="btn primary" id="nextQ">下一題</button></div>`}
  $("qPanel").innerHTML=h;renderStats();
}
function newBluffQuiz(hero,board,pot){
  const sc=pick(SCEN),set=baseFor(sc[0],sc[1],"normal",sc[2]),g={fold:pick(["easy","normal","normal","sticky"])};
  const cs=expand(set,new Set([...hero,...board]));for(const c of cs)c[2]*=WEIGHTS.check[tierOf(c,board)];
  const list=cs.filter(c=>c[2]>.001),now=equity(hero,board,list,15000),eqNow=(now.w+now.t/2)/now.n;
  const frac=pick([.5,.75,1]),bet=Math.max(1,Math.round(pot*frac*10)/10),b=betEval(hero,board,[list],[g],pot,bet,eqNow,15000);
  Q={kind:"bet",hero,board,pot,bet,frac,fold:g.fold,name:`${scenarioName(sc[0],sc[1],sc[2])}（約 ${Math.round(combosIn(set)/1326*100)}%）`,...b,eqNow,answered:false,guess:50};
  renderQuiz();
}
function renderBetQuiz(){
  const st=["","","","Flop","Turn","River"][Q.board.length];
  const cards=a=>a.map(c=>`<span class="slot filled">${cardHTML(c)}</span>`).join("");
  const fl={easy:"易 fold",normal:"正常",sticky:"唔肯 fold"}[Q.fold];
  let h=`<div class="label">Bluff 題 · 你嘅手牌</div><div class="quizcards">${cards(Q.hero)}</div>
  <div class="label">公共牌 <span>${st}</span></div><div class="quizcards">${cards(Q.board)}</div>
  <dl class="kv"><dt>對手 preflop</dt><dd>${Q.name}</dd><dt>對手類型</dt><dd>${fl}</dd><dt>Pot</dt><dd>${Q.pot} bb</dd><dt>對手</dt><dd>Check 俾你</dd></dl>`;
  if(!Q.answered){
    h+=`<div class="slider"><label for="gIn" class="label">你估落 ${Q.bet} bb（${Math.round(Q.frac*100)}% pot）佢會 fold 幾多？</label><div class="guess" id="gOut">${Q.guess}%</div>
    <input id="gIn" type="range" min="0" max="100" value="${Q.guess}"></div>
    <div class="row"><button class="btn primary" data-a="bet">Bet ${Q.bet} bb</button><button class="btn" data-a="check">Check</button></div>`;
  }else{
    const best=Q.evBet>Q.evCheck?"bet":"check",ok=Q.ans===best,err=Math.abs(Q.guess-Q.FE*100);
    h+=`<div class="verdict ${ok?"good":"bad"}"><span class="chip">${ok?"答啱":"答錯"}</span><span>較好嘅選擇：<b>${best==="bet"?"Bet":"Check"}</b>。${betKind(Q.eqC,Q.board)}</span></div>
    <dl class="kv"><dt>對手 fold 機會</dt><dd>${pct(Q.FE)}</dd><dt>你估</dt><dd>${Q.guess}%（差 ${err.toFixed(1)}）</dd><dt>純 bluff 要幾多 fold</dt><dd>${pct(Q.be)}</dd>
    <dt>俾人 call 之後 equity</dt><dd>${Q.eqC==null?"–":pct(Q.eqC)}</dd><dt>Bet EV</dt><dd>${Q.evBet>=0?"+":""}${Q.evBet.toFixed(2)} bb</dd><dt>Check EV</dt><dd>+${Q.evCheck.toFixed(2)} bb</dd></dl>
    <div class="row"><button class="btn primary" id="nextQ">下一題</button></div>`;
  }
  $("qPanel").innerHTML=h;renderStats();
  const g=$("gIn");if(g)g.oninput=()=>{Q.guess=+g.value;$("gOut").textContent=g.value+"%"};
}
function renderQuiz(){
  if(Q.kind==="bet")return renderBetQuiz();
  if(Q.kind==="pre")return renderPreQuiz();
  const st=["","","","Flop","Turn","River"][Q.board.length];
  const cards=a=>a.map(c=>`<span class="slot filled">${cardHTML(c)}</span>`).join("");
  let h=`<div class="label">你嘅手牌</div><div class="quizcards">${cards(Q.hero)}</div>
  <div class="label">公共牌 <span>${st}</span></div><div class="quizcards">${cards(Q.board)}</div>
  <dl class="kv">${Q.names.map((n,i)=>`<dt>對手 ${i+1}</dt><dd>${n}</dd>`).join("")}<dt>Pot（落注前）</dt><dd>${Q.pot} bb</dd><dt>對手 1 bet</dt><dd>${Q.bet} bb (${Math.round(Q.frac*100)}%)</dd>${Q.callers?`<dt>對手 2</dt><dd>已經跟咗 ${Q.bet} bb</dd>`:""}</dl>`;
  if(!Q.answered){
    h+=`<div class="msg">對手 1 ${Q.frac>=.75?"落大注":"落細注"}${Q.callers?"，對手 2 跟咗。多人底池要同時贏晒兩個人":""}。諗吓佢哋 range 會收窄成點。</div>
    <div class="slider"><label for="gIn" class="label">你估自己 equity 幾多？</label><div class="guess" id="gOut">${Q.guess}%</div>
    <input id="gIn" type="range" min="0" max="100" value="${Q.guess}"></div>
    <div class="row"><button class="btn primary" data-a="call">Call</button><button class="btn" data-a="fold">Fold</button></div>`;
  }else{
    const ok=(Q.eq>=Q.req)===(Q.ans==="call"),err=Math.abs(Q.guess-Q.eq*100),ev=Q.eq*Q.total-Q.bet;
    h+=`<div class="verdict ${ok?"good":"bad"}"><span class="chip">${ok?"答啱":"答錯"}</span><span>正確決定：<b>${Q.eq>=Q.req?"Call":"Fold"}</b>，你揀咗 ${Q.ans==="call"?"Call":"Fold"}</span></div>
    <dl class="kv"><dt>真實 equity</dt><dd>${pct(Q.eq)}</dd><dt>你估</dt><dd>${Q.guess}%（差 ${err.toFixed(1)}）</dd><dt>需要 equity</dt><dd>${pct(Q.req)}</dd>
    <dt>Call 嘅 EV</dt><dd>${ev>=0?"+":""}${ev.toFixed(2)} bb</dd></dl>
    <div class="row"><button class="btn primary" id="nextQ">下一題</button></div>`;
  }
  $("qPanel").innerHTML=h;renderStats();
  const g=$("gIn");if(g)g.oninput=()=>{Q.guess=+g.value;$("gOut").textContent=g.value+"%"};
}
$("qPanel").addEventListener("click",e=>{
  const a=e.target.closest("[data-a]");
  if(a&&!Q.answered){Q.ans=a.dataset.a;Q.answered=true;stats.n++;
    if(Q.kind==="pre"){if(Q.ans===Q.best)stats.c++}
    else if(Q.kind==="bet"){if(Q.ans===(Q.evBet>Q.evCheck?"bet":"check"))stats.c++;stats.e+=Math.abs(Q.guess-Q.FE*100);stats.g++}
    else{if((Q.eq>=Q.req)===(Q.ans==="call"))stats.c++;stats.e+=Math.abs(Q.guess-Q.eq*100);stats.g++}
    saveStats();renderQuiz()}
  if(e.target.id==="nextQ")newQuiz();
});
$("resetStats").onclick=()=>{stats={n:0,c:0,e:0,g:0};saveStats();renderStats()};

buildPicker();loadSample();renderStats();
</script>
