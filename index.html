<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Equity 練習簿</title>
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Equity 練習簿">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: single study column; cards first, verdict right under them, range + sizing below. Suits use a 4-colour deck. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#14201C; --muted:#5A6A64; --line:#D2DBD7;
  --accent:#0E6B57; --accent-soft:#D5EAE3; --accent-ink:#FFFFFF;
  --good:#1D7A3E; --good-soft:#DCF0E2; --bad:#B3261E; --bad-soft:#F7DEDB; --tie:#9AA8A2;
  --face:#FFFFFF; --face-line:#C9D2CE;
  --spade:#1A1F1D; --heart:#C62828; --diamond:#C62828; --club:#1A1F1D;
  --cell-pair:#E4E9E7; --cell-s:#EEF2F0; --cell-o:#F6F8F7;
  --t1:#0E6B57; --t2:#6FB3A2; --t3:#C98A1B; --t4:#BFC9C5;
  --warn:#8A5A00; --warn-soft:#F6EAD0;
  --f-display:"Bricolage Grotesque","PingFang HK","Noto Sans HK",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --ink:#E3EBE7; --muted:#93A39C; --line:#2B3632;
  --accent:#4FC3A1; --accent-soft:#1D3A31; --accent-ink:#06211A;
  --good:#5BD38A; --good-soft:#163323; --bad:#FF7F73; --bad-soft:#3A1D1A; --tie:#5E6D67;
  --face:#F1F3F0; --face-line:#F1F3F0;
  --cell-pair:#26302C; --cell-s:#1F2825; --cell-o:#1B2421; --t1:#4FC3A1; --t2:#2E7D69; --t3:#E0A43A; --t4:#3D4A45; --warn:#E8B45A; --warn-soft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --ink:#E3EBE7; --muted:#93A39C; --line:#2B3632;
  --accent:#4FC3A1; --accent-soft:#1D3A31; --accent-ink:#06211A;
  --good:#5BD38A; --good-soft:#163323; --bad:#FF7F73; --bad-soft:#3A1D1A; --tie:#5E6D67;
  --face:#F1F3F0; --face-line:#F1F3F0;
  --cell-pair:#26302C; --cell-s:#1F2825; --cell-o:#1B2421; --t1:#4FC3A1; --t2:#2E7D69; --t3:#E0A43A; --t4:#3D4A45; --warn:#E8B45A; --warn-soft:#3A2E17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.1;margin:0;letter-spacing:-.01em;white-space:nowrap}
.tabs.main{width:min(232px,62vw);padding:3px;gap:2px;grid-template-columns:repeat(4,1fr)}
.tabs.main button{padding:6px 2px;font-size:13.5px}
.tabs.sub3{grid-template-columns:repeat(3,1fr)}
.tabs.sub3 button{padding:7px}
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:6px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:96px;transition:opacity .15s}
.summary.busy{opacity:.55}
.sumtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sumcards{display:flex;gap:3px;align-items:center;min-width:0}
.mc{width:27px;height:37px;flex:none;border-radius:5px;border:1px solid var(--face-line);background:var(--face);font:700 12.5px var(--f-mono);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0;cursor:pointer}
.mc small{font-size:11.5px}
.mc.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:500}
.mc-gap{width:7px;flex:none}
.pill{font:700 12.5px var(--f-body);padding:5px 11px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good);color:var(--surface)}.pill.bad{background:var(--bad);color:var(--surface)}.pill.neu{background:var(--line);color:var(--ink)}
.sumline{display:flex;align-items:center;gap:10px}
.sumline .num{font:700 30px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1}
.sumline .bar{flex:1}
.sumsub{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sumsub b{color:var(--ink);font-weight:600}
details.panel{display:block}
details.imp>summary{cursor:pointer;list-style:none;font-size:13px}
details.imp>summary::-webkit-details-marker{display:none}
#hhText{width:100%;font:13px var(--f-mono);padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.stats6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;margin-bottom:10px}
.stats6 .stat b{font-size:17px}
.stat small{font-size:11px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.leaks{display:flex;flex-direction:column;gap:6px}
.leak{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;cursor:pointer;font:inherit}
.leak>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.leak small{color:var(--muted);font-size:12.5px}
.leak .lv{font:600 12.5px var(--f-mono);text-align:right}
.hlist{display:flex;flex-direction:column}
.hrow{border-top:1px solid var(--line)}
.hhead{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--ink);padding:9px 2px;cursor:pointer;text-align:left;font:inherit}
.hcards{display:flex;gap:2px;flex:none}
.hcards .mc,.sthead .mc,.msg .mc{cursor:default;display:inline-flex}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hmeta b{font-size:13.5px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:600 11px var(--f-body);font-style:normal;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--ink)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hnet{font:700 14px var(--f-mono);white-space:nowrap}
.hdet{padding:2px 0 14px;display:flex;flex-direction:column;gap:12px}
.street{display:flex;flex-direction:column;gap:5px}
.sthead{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.sthead b{margin-right:6px;font-size:13.5px}
.sthead>span{margin-left:6px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.sizing{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.5}
.dec2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dec2>div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.dec2 b{color:var(--ink);font-size:14px}.dec2 em{font-style:normal;font-weight:600}
svg.cum{width:100%;height:auto;display:block;overflow:visible}
svg.cum text{font:10px var(--f-mono);fill:var(--muted)}
svg.cum .gl{stroke:var(--line);stroke-width:1}svg.cum .zero{stroke:var(--muted);stroke-width:1}
svg.cum path{fill:none;stroke-width:2;stroke-linejoin:round}
svg.cum path.a{stroke:var(--accent)}svg.cum path.e{stroke:var(--t3);stroke-dasharray:5 3}
svg.cum .ad{fill:var(--accent)}svg.cum .ed{fill:var(--t3)}
.ln{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.ln.a{border-color:var(--accent)}.ln.e{border-color:var(--t3);border-top-style:dashed}
.advice{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:10px 12px;background:var(--bg)}
.advice .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.advice .act{font:800 24px var(--f-display);line-height:1.15}
.advice .sub{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.advice.good{background:var(--good-soft)}.advice.good .act{color:var(--good)}
.advice.bad{background:var(--bad-soft)}.advice.bad .act{color:var(--bad)}
svg.cum path.f{stroke:var(--good);stroke-dasharray:1.5 3;stroke-linecap:round}svg.cum .fd{fill:var(--good)}
.ln.f{border-color:var(--good);border-top-style:dotted}
.simt td small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.simt td:first-child{white-space:normal}
.lvtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.lvb{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 2px;cursor:pointer;font:inherit}
.lvb b{font:700 13px var(--f-mono)}.lvb span{font-size:11.5px;white-space:nowrap}.lvb i{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.lvb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.lvb[aria-pressed="true"] i{color:var(--accent-ink)}
.lvgoal{font:700 17px var(--f-display);line-height:1.3}
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ms li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:9px;background:var(--bg)}
.ms li b{font:600 12.5px var(--f-mono);text-align:right;white-space:nowrap;color:var(--muted)}
.ms li.ok{background:var(--good-soft)}.ms li.ok b,.ms li.ok span{color:var(--good)}
.lessons{display:flex;flex-direction:column}
.lesson{border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 2px;font-weight:600;font-size:15px;list-style:none}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary::after{content:"＋";color:var(--muted);font-weight:400}
.lesson[open] summary::after{content:"－"}
.lesson .done{margin-left:auto;font:600 11px var(--f-body);padding:2px 8px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.lbody{display:flex;flex-direction:column;gap:10px;padding:0 2px 14px;font-size:14.5px;line-height:1.65}
.lbody p{margin:0}.lbody ul,.lbody ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.lbody .btn{align-self:flex-start;font-size:13px;padding:6px 12px}
.cb.open{margin-left:auto;padding:4px 10px;font-size:12px}
.alog{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.alog li.me{color:var(--ink)}
.note{font-size:12px;padding:1px 6px;border-radius:6px;background:var(--cell-s);color:var(--ink);display:inline-block;margin-top:2px}
.note.ok{background:var(--good-soft);color:var(--good)}.note.no{background:var(--bad-soft);color:var(--bad)}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;padding-block:4px}
.more-body{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{font:600 15px var(--f-body);border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.label span{text-transform:none;letter-spacing:0;font-weight:400}

.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:50px;height:68px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--muted);font:500 11px var(--f-body)}
.slot.filled{border:0}
.slot.active{border:2px solid var(--accent);border-style:solid}
.slot.filled.active{outline:2px solid var(--accent);outline-offset:2px}
.gapper{width:6px}
.card{width:100%;height:100%;border-radius:8px;background:var(--face);border:1px solid var(--face-line);display:flex;flex-direction:column;align-items:flex-start;padding:4px 6px;font-family:var(--f-mono);line-height:1}
.card b{font-size:20px;font-weight:700}
.card i{font-style:normal;font-size:22px;margin-top:auto;align-self:flex-end}
.c0{color:var(--spade)}.c1{color:var(--heart)}.c2{color:var(--diamond)}.c3{color:var(--club)}

.picker{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.pk{aspect-ratio:.78;border-radius:5px;border:1px solid var(--face-line);background:var(--face);font:700 12px var(--f-mono);padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pk small{font-size:11px}
.pk:disabled{opacity:.18;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .num{font-family:var(--f-mono);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .cap{color:var(--muted);font-size:13px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar .w{background:var(--good)}.bar .t{background:var(--tie)}.bar .l{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.made{font-size:14px}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;font-size:14px}
.verdict.good{background:var(--good-soft)}.verdict.bad{background:var(--bad-soft)}
.chip{font:700 13px var(--f-body);padding:3px 10px;border-radius:999px;color:var(--surface)}
.good .chip{background:var(--good)}.bad .chip{background:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv dt{color:var(--muted)}
.msg{color:var(--muted);font-size:14px}

.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.inputs input{font:500 16px var(--f-mono);padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}

.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}
.cell{aspect-ratio:1;border:0;border-radius:3px;font:600 9px var(--f-mono);padding:0;cursor:pointer;color:var(--muted);letter-spacing:-.03em;
  background:color-mix(in srgb,var(--accent) calc(var(--w,0)*100%),var(--base))}
.cell.p{--base:var(--cell-pair)}.cell.s{--base:var(--cell-s)}.cell.o{--base:var(--cell-o)}
.cell.hi{color:var(--accent-ink)}
.gsteps{display:flex;flex-direction:column;gap:8px}
.gstep{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:center}
.gstep>span{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cb{font:600 13px var(--f-body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cb:disabled{opacity:.35;cursor:default}
.hint{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:8px 11px;line-height:1.55}
.hint p{margin:0}.hint p+p{margin-top:4px}
.hr{height:1px;background:var(--line)}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.mix div{height:100%}
.k1{background:var(--t1)}.k2{background:var(--t2)}.k3{background:var(--t3)}.k4{background:var(--t4)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
@media (min-width:430px){.cell{font-size:10px}}

.quizcards{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quizcards .slot{cursor:default}
.slider{display:flex;flex-direction:column;gap:6px}
.slider input{width:100%;accent-color:var(--accent)}
.guess{font:700 32px var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 20px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tabs button{font-size:14px}
.tbl{overflow-x:auto;margin-inline:-4px}
.sz{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.sz th{font-weight:600;color:var(--muted);text-align:right;padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.sz td{text-align:right;padding:7px 5px;border-bottom:1px solid var(--line);font-family:var(--f-mono);white-space:nowrap}
.sz th:first-child,.sz td:first-child{text-align:left}
.sz td:first-child{font-family:var(--f-body)}
.sz tr.best td{background:var(--good-soft);font-weight:700}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding-top:4px}
@media (prefers-reduced-motion:no-preference){.bar div{transition:width .3s ease}}
</style>

<div class="app">
  <header class="top">
    <h1>Equity 練習簿</h1>
    <div class="tabs main" role="tablist">
      <button id="tabCalc" role="tab" aria-selected="true">計算</button>
      <button id="tabQuiz" role="tab" aria-selected="false">練習</button>
      <button id="tabHH" role="tab" aria-selected="false">紀錄</button>
      <button id="tabLearn" role="tab" aria-selected="false">教學</button>
    </div>
  </header>

<script>
/* ===== engine ===== */
const RANKS="23456789TJQKA", SYM=["♠","♥","♦","♣"];
const rl=r=>r===8?"10":RANKS[r];
const CAT=["高牌","一對","兩對","三條","順子","同花","葫蘆","四條","同花順"];
function straightHigh(mask){const m2=(mask<<1)|((mask>>12)&1);for(let t=13;t>=4;t--){if(((m2>>(t-4))&31)===31)return t}return -1}
function enc(cat,a){let v=cat;for(let i=0;i<5;i++)v=v*16+(a[i]===undefined?0:a[i]+1);return v}
function evalHand(cs){
  const cnt=new Int8Array(13),sc=[0,0,0,0],sm=[0,0,0,0];let m=0;
  for(let i=0;i<cs.length;i++){const c=cs[i],r=c>>2,s=c&3;cnt[r]++;sc[s]++;sm[s]|=1<<r;m|=1<<r}
  for(let s=0;s<4;s++)if(sc[s]>=5){const st=straightHigh(sm[s]);if(st>=0)return enc(8,[st]);
    const a=[];for(let r=12;r>=0&&a.length<5;r--)if(sm[s]&(1<<r))a.push(r);return enc(5,a)}
  const q=[],t=[],p=[];for(let r=12;r>=0;r--){if(cnt[r]===4)q.push(r);else if(cnt[r]===3)t.push(r);else if(cnt[r]===2)p.push(r)}
  const others=(ex,n)=>{const a=[];for(let r=12;r>=0&&a.length<n;r--)if(cnt[r]&&!ex.includes(r))a.push(r);return a};
  if(q.length)return enc(7,[q[0],...others([q[0]],1)]);
  if(t.length&&(t.length>1||p.length)){const sec=Math.max(t.length>1?t[1]:-1,p.length?p[0]:-1);return enc(6,[t[0],sec])}
  const st=straightHigh(m);if(st>=0)return enc(4,[st]);
  if(t.length)return enc(3,[t[0],...others([t[0]],2)]);
  if(p.length>=2)return enc(2,[p[0],p[1],...others([p[0],p[1]],1)]);
  if(p.length)return enc(1,[p[0],...others([p[0]],3)]);

}
const catOf=v=>Math.floor(v/1048576);
/* combos: [cardA, cardB, weight, classKey] */
function equity(hero,board,combos,iters){
  const known=new Set([...hero,...board]);const deck=[];for(let c=0;c<52;c++)if(!known.has(c))deck.push(c);
  const need=5-board.length;let w=0,t=0,l=0,curV,curW;
  const H=hero.concat(board),V=board.slice();
  const score=run=>{const h=evalHand(H.concat(run)),v=evalHand(run.concat(V,curV));if(h>v)w+=curW;else if(h===v)t+=curW;else l+=curW};
  if(need<=1){
    for(const vc of combos){curV=[vc[0],vc[1]];curW=vc[2];if(curW<=0)continue;
      if(need===0)score([]);else for(const c of deck){if(c!==vc[0]&&c!==vc[1])score([c])}}
    return{w,t,l,n:w+t+l,exact:true,sims:0};
  }
  const cum=[];let tot=0;for(const vc of combos){tot+=vc[2];cum.push(tot)}
  const pickV=()=>{const x=Math.random()*tot;let lo=0,hi=cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]>x)hi=m;else lo=m+1}return combos[lo]};
  const run=new Array(need);curW=1;
  for(let it=0;it<iters;it++){
    const vc=pickV();curV=[vc[0],vc[1]];
    let k=0;while(k<need){const c=deck[(Math.random()*deck.length)|0];
      if(c===curV[0]||c===curV[1])continue;let dup=false;for(let j=0;j<k;j++)if(run[j]===c){dup=true;break}
      if(!dup)run[k++]=c}
    score(run.slice());
  }
  return{w,t,l,n:w+t+l,exact:false,sims:iters};
}
/* multiway Monte Carlo: lists = one weighted combo list per opponent */
function equityMulti(hero,board,lists,iters){
  const known=new Set([...hero,...board]);const deck=[];for(let c=0;c<52;c++)if(!known.has(c))deck.push(c);
  const need=5-board.length,H=hero.concat(board);
  const cums=lists.map(cs=>{const a=[];let t=0;for(const c of cs){t+=c[2];a.push(t)}return{a,t,cs}});
  const pick=k=>{const{a,t,cs}=cums[k],x=Math.random()*t;let lo=0,hi=a.length-1;while(lo<hi){const m=(lo+hi)>>1;if(a[m]>x)hi=m;else lo=m+1}return cs[lo]};
  let w=0,t=0,l=0,eq=0,n=0;
  for(let it=0;it<iters;it++){
    const used=new Set(),opp=[];let ok=true;
    for(let k=0;k<lists.length;k++){let c,tries=0;do{c=pick(k);tries++}while((used.has(c[0])||used.has(c[1]))&&tries<40);
      if(used.has(c[0])||used.has(c[1])){ok=false;break}used.add(c[0]);used.add(c[1]);opp.push(c)}
    if(!ok)continue;
    const run=[];while(run.length<need){const c=deck[(Math.random()*deck.length)|0];if(!used.has(c)&&!run.includes(c))run.push(c)}
    const hv=evalHand(H.concat(run));let beaten=false,ties=0;
    for(const o of opp){const v=evalHand([o[0],o[1],...board,...run]);if(v>hv){beaten=true;break}if(v===hv)ties++}
    n++;if(beaten)l++;else if(ties){t++;eq+=1/(ties+1)}else{w++;eq+=1}

/* hand classes */
const CLASSES=[];
(function(){const pts=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  for(let i=12;i>=0;i--)for(let j=12;j>=0;j--){
    let hi,lo,type;if(i===j){hi=lo=i;type="p"}else if(i>j){hi=i;lo=j;type="s"}else{hi=j;lo=i;type="o"}
    const key=RANKS[hi]+RANKS[lo]+(type==="p"?"":type);
    let s=pts(hi);
    if(type==="p")s=Math.max(5,s*2);else{if(type==="s")s+=2;const g=hi-lo-1;s-=g===0?0:g===1?1:g===2?2:g===3?4:5;if(g<=1&&hi<10)s+=1;s=Math.ceil(s)}
    CLASSES.push({key,hi,lo,type,row:12-i,col:12-j,score:s,n:type==="p"?6:type==="s"?4:12});
  }})();
const ORDER=CLASSES.slice().sort((a,b)=>b.score-a.score||(b.type==="p")-(a.type==="p")||b.hi-a.hi||b.lo-a.lo||(a.type==="s"?-1:1));
function topPct(p){const s=new Set();let cum=0;const target=p*1326/100;for(const c of ORDER){if(cum>=target)break;s.add(c.key);cum+=c.n}return s}
function combosIn(set){let n=0;for(const c of CLASSES)if(set.has(c.key))n+=c.n;return n}
function expand(set,dead){const out=[];for(const c of CLASSES){if(!set.has(c.key))continue;
  for(let a=0;a<4;a++)for(let b=0;b<4;b++){
    if(c.type==="p"&&b<=a)continue;if(c.type==="s"&&a!==b)continue;if(c.type==="o"&&a===b)continue;
    const x=c.hi*4+a,y=c.lo*4+b;if(dead.has(x)||dead.has(y))continue;out.push([x,y,1,c.key])}}
  return out}
/* range notation parser: 22+, A2s+, KQo, 22-JJ, AQs-A9s, KJ */
function parseRange(str){const s=new Set();
  const add=(h,l,sfx)=>{if(h===l){s.add(RANKS[h]+RANKS[h]);return}const hi=Math.max(h,l),lo=Math.min(h,l),b=RANKS[hi]+RANKS[lo];
    if(sfx!=="o")s.add(b+"s");if(sfx!=="s")s.add(b+"o")};
  for(let tok of str.split(",")){tok=tok.trim();if(!tok)continue;const plus=tok.endsWith("+");if(plus)tok=tok.slice(0,-1);
    const [a,b]=tok.split("-"),h=RANKS.indexOf(a[0]),l=RANKS.indexOf(a[1]),sfx=a[2]||"";
    if(h===l){let lo=h,hi=plus?12:h;if(b){const o=RANKS.indexOf(b[0]);lo=Math.min(h,o);hi=Math.max(h,o)}for(let r=lo;r<=hi;r++)add(r,r)}
    else{let lo=l,hi=plus?h-1:l;if(b){const o=RANKS.indexOf(b[1]);lo=Math.min(l,o);hi=Math.max(l,o)}for(let r=lo;r<=hi;r++)add(h,r,sfx)}}
  return s}
/* postflop hand tiers: M monster, S strong, Md medium, D draw, G gutshot, O overcards/ace-high, A air */
function tierOf(h,board){
  const v=evalHand([h[0],h[1],...board]),cat=catOf(v),bcat=catOf(evalHand(board));
  const top=Math.max(...board.map(c=>c>>2)),r1=h[0]>>2,r2=h[1]>>2;
  if(cat>bcat){
    if(cat>=3)return"M";
    if(cat===2){const br=board.map(c=>c>>2);
      if(bcat===1&&r1!==r2&&!(br.includes(r1)&&br.includes(r2))){const r=br.includes(r1)?r1:r2;return r===top?"S":"Md"}
      if(bcat===1&&r1===r2)return r1>top?"S":"Md";
      return"S"}
    if(r1===r2)return r1>top?"S":"Md";
    if(r1===top||r2===top)return"S";return"Md";
  }
  if(board.length<5){
    for(let s=0;s<4;s++){const hs=(h[0]&3)===s||(h[1]&3)===s;if(!hs)continue;
      let n=0;for(const c of [h[0],h[1],...board])if((c&3)===s)n++;if(n>=4)return"D"}
    let mA=0,mB=0;for(const c of board)mB|=1<<(c>>2);mA=mB|(1<<r1)|(1<<r2);
    let outs=0;for(let r=0;r<13;r++){if(mA&(1<<r))continue;if(straightHigh(mA|(1<<r))>=0&&straightHigh(mB|(1<<r))<0)outs++}

const WEIGHTS={
  check:{M:.35,S:.7,Md:1,D:1,G:1,O:1,A:1},
  callS:{M:.5,S:1,Md:1,D:1,G:.7,O:.45,A:.1},
  callB:{M:.6,S:1,Md:.55,D:.85,G:.25,O:.1,A:.02},
  small:{M:1,S:1,Md:.6,D:.8,G:.5,O:.3,A:.25},
  big:{M:1,S:.8,Md:.15,D:.6,G:.2,O:.1,A:.15},
  raise:{M:1,S:.5,Md:.05,D:.45,G:.1,O:.05,A:.12}};
const GROUP={M:0,S:0,Md:1,D:2,G:2,O:3,A:3};
const BLUFFY=t=>t==="G"||t==="O"||t==="A";
function wAdj(act,tier,g){

const FOLD_S={M:0,S:.05,Md:.35,D:.25,G:.55,O:.65,A:.85},FOLD_B={M:0,S:.15,Md:.6,D:.4,G:.8,O:.9,A:.95};

function betEval(hero,board,lists,guides,pot,bet,eqNow,iters){
  const ratio=bet/pot;let FE=1;const callers=[];

const ACTS=[["open","Open raise"],["call","Call"],["threebet","3-bet"],["call3b","Open 後 call 3-bet"],["fourbet","4-bet"],["limp","Limp"]];
const NEEDS_VS=a=>a==="call"||a==="threebet";
const vsOptions=pos=>POS.slice(0,POS.indexOf(pos)).filter(p=>p!=="BB");
const actOK=(pos,a)=>NEEDS_VS(a)?vsOptions(pos).length>0:pos!=="BB";
function normGuide(g){
  if(!actOK(g.pos,g.act))g.act=g.pos==="BB"?"call":"open";
  if(NEEDS_VS(g.act)){const o=vsOptions(g.pos);if(!o.includes(g.vs))g.vs=o[o.length-1]}
  return g}
const TYPES=[["tight","緊"],["normal","一般"],["loose","鬆"]];
const POST=[["check","Check"],["callS","Call 細注"],["callB","Call 大注"],["small","細注 bet"],["big","大注 bet"],["raise","Raise"]];
const STREET={3:"Flop",4:"Turn",5:"River"};
const POS_NOTE={UTG:"最早出聲，後面仲有 5 個人未講嘢，所以最緊。",MP:"比 UTG 闊少少。",CO:"後面只剩 3 個人，開始加多啲同花連張同細 Ax。",
  BTN:"最後出聲、位置最好，係最闊嘅 open range。",SB:"後面只剩 BB，可以開得闊，但 postflop 冇位置。"};
const VS_NOTE={UTG:"UTG open 得好緊（約 17%）",MP:"MP open 都幾緊（約 22%）",CO:"CO open 中等闊（約 29%）",BTN:"BTN open 好闊（約 45%）",SB:"SB 淨係對住 BB，open 得好闊（約 38%）"};
function actNote(g){
  const v=VS_NOTE[g.vs]||"";
  if(g.act==="call"&&g.pos==="BB")return `${v}。BB 已經落咗 1bb，跟注只需要好少 equity，所以 call 得闊；對手 open 越闊，BB 防守就越闊。最強嘅牌會 3-bet，所以唔喺度。`;
  if(g.act==="call")return `${v}。冇 3-bet 而淨係 call，多數係中等牌：細 pair、同花連張、AJ／KQ 呢類。最強嘅牌會 3-bet，所以唔喺度。對手越早位，call 嘅 range 都要越緊。`;
  if(g.act==="threebet")return `${v}。3-bet 係強牌加少量 bluff，bluff 多數用 A5s、A4s 呢類有 A blocker 嘅同花牌。對手越後位、open 越闊，3-bet 就可以越闊。`;
  if(g.act==="call3b")return "Open 完俾人 3-bet 再 call：中強牌，例如 JJ 至 88、AQ、同花大牌。最強嘅牌（QQ+、AK）多數會 4-bet。後位 open 嘅人 call 得闊啲。";
  if(g.act==="fourbet")return "4-bet：幾乎淨係 QQ+ 同 AK，加少量 A5s 呢類 bluff。對住 4-bet，你手牌唔係好強就要好小心。";
  if(g.act==="limp")return "Limp 嘅多數係娛樂型玩家。Range 好闊，但少咗最強嘅牌，因為佢哋有大牌通常會 raise。";
  return POS_NOTE[g.pos]||"";
}
const TYPE_NOTE={tight:"緊：只保留最強嗰七成。",normal:"",loose:"鬆：再加多大約四成較弱嘅手牌，微注枱好多玩家都係咁打。"};
const POST_NOTE={
  check:"Check：有大牌嘅人唔會次次 check，所以 set、兩對呢啲最強嘅牌權重調低；其他牌照留。",
  callS:"Call 細注（半個 pot 以下）：要求唔高，有 pair、有 draw，甚至淨係高張都會跟。冇嘢嘅空氣牌大部分走咗；最強嘅牌有時會 raise，所以權重減半。",
  callB:"Call 大注（大約一個 pot）：要求高好多。中等 pair 少咗一半，弱 draw 同高張差唔多全部走晒，剩低多數係 top pair 以上同強 draw。",
  small:"細注 bet：range 都幾闊，有價值牌、中等牌、draw，同埋少量 bluff。",
  big:"大注 bet：多數係強牌或者強 draw，中等牌好少會咁打。",
  raise:"Raise（包括 check-raise）：係最強嘅訊號。Set、兩對以上全部留低，top pair 只剩一半，中等牌幾乎冇，另外有少量 draw 同 bluff。"};

const BLUFF_NOTE={low:"<b>Bluff 少</b>：佢落注多數係真牌，所以落注嗰陣，冇嘢同淨係高張嘅牌權重大減。佢落大注你就要 fold 多啲。",
  high:"<b>Bluff 多</b>：佢冇嘢都成日落注，所以佢落注嘅 range 入面空氣牌多咗，你可以 call 闊啲。"};
const FOLD_NOTE={easy:"<b>易 fold</b>：你 bluff 佢會成功多啲。",
  sticky:"<b>唔肯 fold</b>（calling station）：佢中少少都會跟到尾。對住呢種人要少 bluff，多啲用好牌 value bet。"};
function adjust(set,type){
  if(type==="normal")return set;const tot=combosIn(set);
  if(type==="tight"){const out=new Set();let cum=0;for(const c of ORDER){if(!set.has(c.key))continue;if(cum>=tot*.7)break;out.add(c.key);cum+=c.n}return out}
  const out=new Set(set);let add=0;const target=Math.max(60,tot*.4),start=ORDER.findIndex(c=>set.has(c.key));
  for(const c of ORDER.slice(Math.max(0,start))){if(add>=target)break;if(!out.has(c.key)){out.add(c.key);add+=c.n}}return out}
function rangeStr(pos,act,vs){
  const stage=pos==="UTG"||pos==="MP"?"early":"late";
  if(act==="open")return OPEN[pos];
  if(act==="call")return pos==="BB"?BB_VS[vs]:pos==="SB"?CALL_VS.UTG:CALL_VS[vs];
  if(act==="threebet")return THREEBET_VS[vs];
  if(act==="call3b")return CALL3B[stage];
  if(act==="fourbet")return FOURBET[stage];
  return LIMP}
function baseFor(pos,act,type,vs){return adjust(parseRange(rangeStr(pos,act,vs)),type)}
function scenarioName(pos,act,vs){
  if(act==="call")return `${pos} call ${vs} 嘅 open`;
  if(act==="threebet")return `${pos} 3-bet ${vs} 嘅 open`;
  return `${pos} ${ACTS.find(a=>a[0]===act)[1]}`}

    +(NEEDS_VS(guide.act)&&!guide.custom?chipRow("對住","vs",vsOptions(guide.pos).map(p=>[p,p+" open"]),guide.vs):"")
    +chipRow("類型","type",TYPES,guide.custom?null:guide.type)
    +chipRow("Bluff","bluff",[["low","少"],["normal","正常"],["high","多"]],guide.bluff)
    +chipRow("Fold","fold",[["easy","易 fold"],["normal","正常"],["sticky","唔肯 fold"]],guide.fold);
  for(const L of [3,4,5])if(bl>=L)h+=chipRow(STREET[L],"post"+L,POST,post[L]);
  $("guide").innerHTML=h;
  const lines=[];
  if(guide.custom)lines.push("你已經手動改咗 range。撳上面嘅位置或者行動就會用返嚮導。");
  else{
    const n=combosIn(range);
    const first=`<b>${scenarioName(guide.pos,guide.act,guide.vs)}</b>：大約 ${(n/1326*100).toFixed(0)}% 手牌。`+actNote(guide);
    lines.push(first);if(TYPE_NOTE[guide.type])lines.push(TYPE_NOTE[guide.type]);

}

/* build weighted combos for the calc tab */
function combosFor(o,board,dead){
  const combos=expand(o.range,dead);
  for(const L of [3,4,5]){if(!o.post[L]||board.length<L)continue;const bd=board.slice(0,L);
    for(const c of combos)c[2]*=wAdj(o.post[L],tierOf(c,bd),o.guide)}
  return combos;
}
let AUTO_NARROW=null;
/* EV of raising to R (total) after a villain bet b into pot */
function raiseEval(hero,board,lists,guides,pot,b,R,iters){
  const ratio=(R-b)/(pot+2*b);let FE=1;const callers=[];
  lists.forEach((cs,k)=>{let tot=0,fw=0;const cl=[];
    for(const c of cs){const t=tierOf(c,board);let f=foldProb(t,ratio,guides[k]);if(t==="M")f=0;if(t==="S")f*=.6;
      tot+=c[2];fw+=c[2]*f;if(c[2]*(1-f)>.001)cl.push([c[0],c[1],c[2]*(1-f),c[3]])}
    FE*=tot?fw/tot:1;callers.push(cl)});
  let eqC=null;
  if(FE<.999&&callers.every(x=>x.length)){const r=callers.length>1?equityMulti(hero,board,callers,iters):equity(hero,board,callers[0],iters);eqC=callers.length>1?r.eq:(r.w+r.t/2)/r.n}
  return{FE,eqC,ev:FE*(pot+b)+(1-FE)*((eqC??0)*(pot+2*R)-R)}}
function buildCombos(){
  saveCur();
  const board=boardNow(),hero=slots.slice(0,2).filter(x=>x!=null),dead=new Set([...hero,...board]);
  const pot=parseFloat($("potIn").value)||0,fb=parseFloat($("callIn").value)||0,L=board.length;
  const autoAct=facing&&L>=3&&pot>0&&fb>0?(fb/pot>=.66?"big":"small"):null;
  const alls=opps.map(o=>{const cs=combosFor(o,board,dead);
    if(autoAct&&!o.post[L])for(const c of cs)c[2]*=wAdj(autoAct,tierOf(c,board),o.guide);
    return cs}),lists=alls.map(a=>a.filter(c=>c[2]>0.001));
  AUTO_NARROW=autoAct&&opps.some(o=>!o.post[L])?autoAct:null;
  return{combos:lists[cur],all:alls[cur],lists,board,hero,dead};
}

  if(hero.length<2)return stop("撳上面嘅「+」或者喺「牌」分頁揀你兩張手牌。");
  if(board.length===1||board.length===2)return stop("公共牌要 0、3、4 或 5 張。");

  if(empty>=0)return stop(`對手 ${empty+1} 嘅 range 入面冇手牌，去「對手」分頁揀返位置。`);
  const multi=lists.length>1;
  const r=multi?equityMulti(hero,board,lists,30000):equity(hero,board,combos,30000),eq=multi?r.eq:(r.w+r.t/2)/r.n;
  const made=board.length>=3?CAT[catOf(evalHand(hero.concat(board)))]:"Preflop";
  const pill=isPre?renderPre(classKey(hero[0],hero[1])):renderAction(hero,board,lists,eq);
  if(multi)$("actOut").insertAdjacentHTML("afterbegin",`<div class="msg">多人底池：你要同時贏晒 ${lists.length} 個對手先算贏，所以 equity 會明顯低過單挑。</div>`);
  setSummary(`<div class="sumline"><span class="num">${pct(eq)}</span><div class="bar"><div class="w" style="width:${r.w/r.n*100}%"></div><div class="t" style="width:${r.t/r.n*100}%"></div><div class="l" style="width:${r.l/r.n*100}%"></div></div></div>
  <div class="sumsub"><span>贏 <b>${pct(r.w/r.n)}</b> · 和 <b>${pct(r.t/r.n)}</b> · 輸 <b>${pct(r.l/r.n)}</b></span><span>${made} · 對 ${lists.length} 個對手 · ${r.exact?"精確":"模擬"}</span></div>`,pill);

/* ===== hand history: parse + analyse (pure, no DOM) ===== */
const HH_SEC=["Preflop","Flop","Turn","River"];
function hhCard(s){return RANKS.indexOf(s[0])*4+"shdc".indexOf(s[1])}
function hhMoney(s){const m=String(s).match(/[\d.]+/);return m?parseFloat(m[0]):0}
function classKey(a,b){const r1=a>>2,r2=b>>2,hi=Math.max(r1,r2),lo=Math.min(r1,r2);
  if(hi===lo)return RANKS[hi]+RANKS[lo];return RANKS[hi]+RANKS[lo]+((a&3)===(b&3)?"s":"o")}
function seatPositions(seats,button){
  const occ=seats.map(s=>s.seat).sort((a,b)=>a-b),n=occ.length,pos={};
  if(n<2)return pos;
  let k=occ.findIndex(s=>s>button);if(k<0)k=0;
  const order=[...occ.slice(k),...occ.slice(0,k)];/* first = SB */
  const name=s=>seats.find(x=>x.seat===s).name;
  if(n===2){pos[name(button)]="BTN";pos[name(order.find(s=>s!==button))]="BB";return pos}
  pos[name(order[0])]="SB";pos[name(order[1])]="BB";
  const rest=order.slice(2),labels=["UTG","MP","CO","BTN"].slice(-rest.length);
  if(rest.length>4){rest.forEach((s,i)=>pos[name(s)]=i<rest.length-3?"UTG":["MP","CO","BTN"][i-(rest.length-3)])}
  else rest.forEach((s,i)=>pos[name(s)]=labels[i]);
  return pos}

function parseHand(text){
  const lines=text.split("\n");
  const m=lines[0].match(/Hand #(\d+):\s*(.*?)\s*\(₮([\d.]+)\/₮([\d.]+)(?:\/₮([\d.]+))?\)\s+(\d{4})\/(\d\d)\/(\d\d) (\d\d:\d\d)/);
  if(!m)return null;
  const H={key:`${m[6]}${m[7]}${m[8]} ${m[9]} ${m[1].padStart(16,"0")}`,id:m[1],bomb:/bomb/i.test(m[2]),sb:+m[3],bb:+m[4],date:`${m[7]}/${m[8]}`,time:m[9],seats:[],actions:[],board:[],
    streetPot:[0,0,0,0],shows:{},collected:{},hero:null,raw:text};
  const bm=text.match(/Seat #(\d+) is the button/);const button=bm?+bm[1]:0;
  for(const L of lines){const s=L.match(/^Seat (\d+): (\S+) \(₮([\d.]+) in chips\)/);if(s)H.seats.push({seat:+s[1],name:s[2],stack:+s[3]})}
  const hc=text.match(/Dealt to Hero \[(\w\w) (\w\w)\]/);if(!hc)return null;
  H.hero=[hhCard(hc[1]),hhCard(hc[2])];
  H.pos=seatPositions(H.seats,button);
  let street=0,cur={},dead=0,total={},returned={},folded=new Set(),allin=new Set(),inShowdown=false;
  const potNow=()=>dead+Object.values(total).reduce((a,b)=>a+b,0)+Object.values(cur).reduce((a,b)=>a+b,0);
  const endStreet=()=>{for(const k in cur)total[k]=(total[k]||0)+cur[k];cur={}};
  for(const L of lines){
    const st=L.match(/^\*\*\* (FIRST |SECOND )?(FLOP|TURN|RIVER) \*\*\* (.*)$/);
    if(st){const ns={FLOP:1,TURN:2,RIVER:3}[st[2]];
      if(ns!==street){endStreet();street=ns;H.streetPot[ns]=potNow()}
      if(st[1]!=="SECOND "){H.board=[...st[3].matchAll(/\b([2-9TJQKA][shdc])\b/g)].map(x=>hhCard(x[1]))}
      continue}
    if(/^\*\*\* (FIRST |SECOND )?SHOWDOWN/.test(L)){inShowdown=true;continue}
    if(/^\*\*\* SUMMARY/.test(L))break;
    const a=L.match(/^(\S+): (posts ante|posts small blind|posts big blind|posts auto big blind|posts [a-z ]+|calls|bets|raises|ALLIN|RETURN|checks|folds|shows|mucks hand)\s*(.*)$/);
    if(a&&!inShowdown){
      const [,who,verb,rest]=a;
      const maxCur=Math.max(0,...Object.values(cur)),mine=cur[who]||0,toCall=Math.max(0,maxCur-mine),potBefore=potNow();
      let amt=0,kind=verb;
      if(verb==="posts ante"){dead+=hhMoney(rest);continue}
      if(verb.startsWith("posts")){cur[who]=mine+hhMoney(rest);continue}
      if(verb==="calls"||verb==="bets"){amt=hhMoney(rest);cur[who]=mine+amt}
      else if(verb==="raises"){const to=hhMoney(rest.split(" to ")[1]);amt=to-mine;cur[who]=to}
      else if(verb==="ALLIN"){amt=hhMoney(rest);cur[who]=mine+amt;allin.add(who);
        kind=mine+amt<=maxCur+1e-9?"calls":(maxCur>0?"raises":"bets")}
      else if(verb==="RETURN"){returned[who]=(returned[who]||0)+hhMoney(rest);cur[who]=mine-hhMoney(rest);continue}
      else if(verb==="folds")folded.add(who);
      H.actions.push({street,who,verb,kind,amt,toCall,potBefore,board:H.board.slice(),allin:verb==="ALLIN",to:cur[who]});
    }
    const sh=L.match(/^(\S+): shows \[(\w\w) (\w\w)\]/);if(sh)H.shows[sh[1]]=[hhCard(sh[2]),hhCard(sh[3])];
    const c=L.match(/^(\S+) collected ₮([\d.]+)/);if(c)H.collected[c[1]]=(H.collected[c[1]]||0)+ +c[2];
  }
  endStreet();
  const fb=text.match(/(?:FIRST )?Board \[([^\]]+)\]/);if(fb)H.finalBoard=fb[1].trim().split(/\s+/).map(hhCard);else H.finalBoard=H.board;
  H.inv=(total.Hero||0);
  const ante=(text.match(/^Hero: posts ante ₮([\d.]+)/m)||[,0])[1];H.inv+= +ante;
  H.net=(H.collected.Hero||0)-H.inv;H.potNet=Object.values(H.collected).reduce((a,b)=>a+b,0);
  H.folded=folded;H.allinSet=allin;
  return H}

function parseHistory(text){
  return text.split(/\n(?=[^\n]*Hand #\d+:)/).map(parseHand).filter(Boolean)}

/* --- per-hand analysis --- */
const PREMIUM=parseRange("TT+,AQs+,AKo");
function analyseHand(H){
  const A={tags:[],notes:[],flags:[],decisions:[]};
  const key=classKey(H.hero[0],H.hero[1]),hp=H.pos.Hero||"?";A.key=key;A.pos=hp;
  const pre=H.actions.filter(a=>a.street===0);
  /* preflop */
  if(!H.bomb){
    const i=pre.findIndex(a=>a.who==="Hero");
    if(i>=0){
      const before=pre.slice(0,i),hero=pre[i];
      const raises=before.filter(a=>a.kind==="raises"||(a.kind==="bets"));
      const limpers=before.filter(a=>a.kind==="calls");
      const act=hero.kind==="raises"||hero.kind==="bets"?"raise":hero.kind==="calls"?"call":hero.verb==="checks"?"check":"fold";
      A.vpip=act==="raise"||act==="call";A.pfr=act==="raise";
      if(act==="raise"&&!hero.allin){
        if(!raises.length){const bbs=hero.to/H.bb,tgt=(hp==="SB"?3:2.5)+limpers.length;
          const ok=bbs>=2&&bbs<=tgt+1.5;A.sizeNotes=[`Preflop 注碼：你 raise 到 ${bbs.toFixed(1)}bb，一般大約 ${tgt}bb${limpers.length?`（每多一個 limp 加 1bb）`:""}。${ok?"大小合理。":bbs<2?"太細，對手好平就可以入池。":"偏大，冒險多但對手只會用好牌跟。"}`];
          if(!ok){A.flags.push("preSize");A.tags.push(["Open 注碼","warn"])}}
        else if(raises.length===1){const mult=hero.to/raises[0].to,ip=!["SB","BB"].includes(hp),tgt=ip?3:4;
          const ok=mult>=2.5&&mult<=5.5;A.sizeNotes=[`Preflop 注碼：你 3-bet 到對手注碼嘅 ${mult.toFixed(1)} 倍，${ip?"有位置":"冇位置"}一般大約 ${tgt} 倍。${ok?"大小合理。":mult<2.5?"太細，對手好容易 call。":"偏大。"}`];
          if(!ok){A.flags.push("preSize");A.tags.push(["3-bet 注碼","warn"])}}}
      if(!raises.length){
        if(act==="call"&&hp!=="BB"){A.limp=true;A.tags.push(["Limp","warn"]);
          if(PREMIUM.has(key)){A.tags.push(["大牌 limp","bad"]);A.flags.push("bigLimp")}}
        if(!limpers.length&&hp!=="BB"&&OPEN[hp]&&act!=="check"){
          const ref=preAction(hp,null,key);A.preRef={ctx:`全部 fold 到你（${hp}）`,ref,act};
          const name={raise:"Raise",fold:"Fold",call:"Limp",check:"Check"};
          if(!(ref===act)){A.flags.push("preDiff");
            A.notes.push(`Preflop：全部 fold 到你喺 ${hp}，參考表係 <b>${name[ref]}</b>，你揀咗 ${name[act]}。${act==="call"?"第一個入池 limp 唔好，一係 raise 一係 fold。":""}`)}
          else A.notes.push(`Preflop：全部 fold 到你喺 ${hp}，你 ${name[act]}，同參考表一致。`)}
        else if(limpers.length&&act==="call"&&hp!=="BB")A.notes.push(`Preflop：前面有人 limp，你跟住 limp。有好牌應該加注孤立佢哋，弱牌就 fold。`);
      }else if(raises.length===1){
        const vsPos=H.pos[raises[0].who];
        if(raises[0].who!=="Hero"&&vsOptions(hp).includes(vsPos)){
          const ref=preAction(hp,vsPos,key),mine=act==="raise"?"3bet":act==="call"?"call":"fold";
          if(act==="raise")A.threebet=true;
          const name={"3bet":"3-bet",call:"Call",fold:"Fold"};
          A.preRef={ctx:`${vsPos} open，你喺 ${hp}`,ref,act:mine};
          if(ref!==mine){A.flags.push("preDiff");A.notes.push(`Preflop：${vsPos} open，你喺 ${hp}，參考表係 <b>${name[ref]}</b>，你揀咗 ${name[mine]}。`)}
          else A.notes.push(`Preflop：${vsPos} open，你 ${name[mine]}，同參考表一致。`)}
      }else A.notes.push(`Preflop：你出聲之前已經有人 3-bet，呢度冇參考表比較。`);
    }
  }else A.tags.push(["Bomb pot",""]);
  /* postflop decisions */
  const villainsShown=Object.keys(H.shows).filter(n=>n!=="Hero");
  for(const a of H.actions){
    if(a.who!=="Hero"||a.street===0)continue;
    const d={street:a.street,kind:a.kind,verb:a.verb,amt:a.amt,toCall:a.toCall,potBefore:a.potBefore,board:a.board,allin:a.allin};
    if(a.toCall>0){d.req=a.toCall/(a.potBefore+a.toCall);d.betRatio=a.toCall/Math.max(.01,a.potBefore-a.toCall)}
    d.tier=tierOf(H.hero,a.board);
    if(a.street===3&&a.toCall>0&&(a.kind==="calls")&&d.betRatio>=.5&&["Md","O","A","G","D"].includes(d.tier)){
      d.flag="riverWeakCall";A.flags.push("riverWeakCall");A.tags.push(["River 弱牌 call 大注","bad"])}
    if(a.kind==="bets"){d.size=a.amt/Math.max(.01,a.potBefore);A.sizes=A.sizes||[];A.sizes.push({tier:d.tier,size:d.size,street:a.street});
      if(["M","S"].includes(d.tier)&&a.street>=2&&d.size<.4&&!a.allin){A.flags.push("valueSmall");A.tags.push(["強牌注碼細","warn"])}
      if(d.tier==="Md"&&a.street===3&&d.size>=.9){A.flags.push("mediumBig");A.tags.push(["中等牌落大注","warn"])}}
    if(a.kind==="raises"&&!a.allin){const prev=(a.to-a.amt)+a.toCall;d.raiseMult=a.to/Math.max(.01,prev);
      if(d.raiseMult<2.5){A.flags.push("minRaise");A.tags.push(["Raise 太細","warn"])}}
    A.decisions.push(d)}
  /* all-in EV */
  const alls=H.actions.filter(a=>a.allin);
  const sdOpp=villainsShown.map(n=>H.shows[n]);
  if(alls.length&&H.shows.Hero&&sdOpp.length&&!H.folded.has("Hero")){
    const st=alls[alls.length-1].street,nb=[0,3,4,5][st],bAt=H.finalBoard.slice(0,nb);
    let eq;if(sdOpp.length===1){const r=equity(H.hero,bAt,[[...sdOpp[0],1]],20000);eq=(r.w+r.t/2)/r.n}
    else eq=equityMulti(H.hero,bAt,sdOpp.map(o=>[[...o,1]]),20000).eq;
    const ev=eq*H.potNet-H.inv;A.allin={street:st,eq,ev,luck:H.net-ev,board:bAt,opp:sdOpp};
    A.tags.push(["All-in",""]);
    if(st<3&&eq>=.6&&H.net<0){A.tags.push(["Bad beat","bad"]);A.flags.push("badBeat")}
    if(st<3&&eq<=.4&&H.net>0)A.tags.push(["追中咗","good"]);
    if(st<3&&eq<.4){A.flags.push("allinBehind");A.tags.push(["入錢時落後","warn"])}
  }
  A.showdown=!!H.shows.Hero;A.sawFlop=H.actions.some(a=>a.street>=1&&a.who==="Hero")||(!!H.shows.Hero&&!H.folded.has("Hero"));
  return A}

function summarise(list){
  const S={hands:list.length,net:0,bb100:0,vpip:0,pfr:0,limp:0,bigLimp:0,threebet:0,sawFlop:0,sd:0,wsd:0,nonBomb:0,
    allins:0,allEV:0,allNet:0,sz:{strong:{n:0,sum:0,all:[]},medium:{n:0,sum:0,all:[]},weak:{n:0,sum:0,all:[]}},riverWeak:0,riverWeakNet:0,preDiff:0,badBeat:0,badBeatLuck:0};
  let bbSum=0;
  for(const {H,A} of list){
    S.net+=H.net;bbSum+=H.net/H.bb;
    if(!H.bomb){S.nonBomb++;if(A.vpip)S.vpip++;if(A.pfr)S.pfr++}
    if(A.limp)S.limp++;if(A.flags.includes("bigLimp"))S.bigLimp++;if(A.threebet)S.threebet++;
    if(A.sawFlop)S.sawFlop++;if(A.showdown){S.sd++;if(H.net>0)S.wsd++}
    if(A.allin){S.allins++;S.allEV+=A.allin.ev;S.allNet+=H.net}
    if(A.flags.includes("riverWeakCall")){S.riverWeak++;S.riverWeakNet+=H.net}
    if(A.flags.includes("preDiff"))S.preDiff++;
    for(const f of ["valueSmall","mediumBig","minRaise","preSize"])if(A.flags.includes(f))S[f]=(S[f]||0)+1;
    for(const z of A.sizes||[]){const g={M:"strong",S:"strong",Md:"medium"}[z.tier]||"weak";S.sz[g].n++;S.sz[g].sum+=z.size;S.sz[g].all.push(z.size)}
    if(A.flags.includes("badBeat")){S.badBeat++;S.badBeatLuck+=A.allin.luck}
  }
  S.dec={n:0,call:0,callBad:0,fold:0,foldBad:0,lostCall:0,lostFold:0,raise:0};
  for(const {A} of list)for(const d of A.dec||[]){S.dec.n++;
    if(d.kind==="call"){S.dec.call++;if(d.v==="badCall"){S.dec.callBad++;S.dec.lostCall+=-d.callEV}}
    else if(d.kind==="fold"){S.dec.fold++;if(d.v==="badFold"){S.dec.foldBad++;S.dec.lostFold+=d.callEV}}
    else if(d.kind==="raise")S.dec.raise++}
  S.bb100=list.length?bbSum/list.length*100:0;return S}
/* evaluate every postflop spot where Hero faced a bet, against the modelled villain range */
function decisionEvals(H){
  const out=[];
  H.actions.forEach((a,idx)=>{
    if(a.who!=="Hero"||a.street===0||!(a.toCall>0))return;
    const opps=hhVillainOpps(H,a.street,idx),dead=new Set([...H.hero,...a.board]);
    const lists=opps.map(o=>combosFor(o,a.board,dead).filter(c=>c[2]>.001));
    if(lists.some(l=>!l.length))return;
    let eq;
    if(lists.length===1&&a.board.length===5){const r=equity(H.hero,a.board,lists[0],0);eq=(r.w+r.t/2)/r.n}
    else eq=equityMulti(H.hero,a.board,lists,a.board.length===5?1500:2000).eq;
    const req=a.toCall/(a.potBefore+a.toCall),callEV=eq*(a.potBefore+a.toCall)-a.toCall,margin=(a.street===1?.05:.03)*(a.potBefore+a.toCall);
    const kind=a.kind==="calls"?"call":a.verb==="folds"?"fold":a.kind==="raises"?"raise":"other";
    let v="ok";
    if(kind==="call"&&callEV<-margin)v="badCall";
    if(kind==="fold"&&callEV>margin)v="badFold";
    if(kind==="raise"&&callEV<-margin)v="raiseLight";
    out.push({idx,street:a.street,kind,eq,req,callEV,v});
  });
  return out}


/* ===== hand history: UI ===== */
let HH=[],hhFilter="all";
const sgn=(v,d=2)=>(v>=0?"+":"−")+"₮"+Math.abs(v).toFixed(d);
const miniCard=c=>`<span class="mc c${c&3}">${rl(c>>2)}<small>${SYM[c&3]}</small></span>`;

function heroForced(H){let f=0;for(const m of H.raw.matchAll(/^Hero: posts [^₮\n]*₮([\d.]+)/gm))f+= +m[1];return f}
function simulateHand(x){
  const {H,A}=x,forced=heroForced(H);
  let sim=H.net,why=null,est=false;
  if(A.preRef&&A.preRef.ref==="fold"&&A.preRef.act!=="fold"&&A.preRef.act!=="check"){sim=-forced;why="preFold"}
  else{
    const ev=(A.dec||[]).filter(d=>d.v==="badCall"||d.v==="badFold").sort((a,b)=>a.idx-b.idx)[0];
    if(ev&&ev.v==="badCall"){let inv=forced;H.actions.forEach((a,k)=>{if(k<ev.idx&&a.who==="Hero")inv+=a.amt});sim=-inv;why="noCall"}
    else if(ev){sim=H.net+ev.callEV;why="callInstead";est=true}}
  const noLuck=why===null&&A.allin&&A.allin.street<3?A.allin.ev:sim;
  return{sim,noLuck,why,est,delta:sim-H.net}}
function simulateAll(list){
  const R={actual:0,preFold:{n:0,d:0},noCall:{n:0,d:0},callInstead:{n:0,d:0},luck:0,sim:0,noLuck:0,limpRaise:0};
  for(const x of list){const s=simulateHand(x);x.sim=s;R.actual+=x.H.net;R.sim+=s.sim;R.noLuck+=s.noLuck;R.luck+=s.noLuck-s.sim;
    if(s.why)R[s.why].n++,R[s.why].d+=s.delta;
    if(x.A.limp&&x.A.preRef&&x.A.preRef.ref==="raise")R.limpRaise++}
  return R}

function applyDec(x,dec){

  if(dec.some(d=>d.v==="badCall")){x.A.flags.push("badCall");x.A.tags.push(["Call 蝕","bad"])}

function niceStep(range){const raw=range/4,p=Math.pow(10,Math.floor(Math.log10(raw||1))),f=raw/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}

function hhPick(){

  else if(hhFilter==="lose")L=L.filter(x=>x.H.net<0).sort((a,b)=>a.H.net-b.H.net).slice(0,30);
  else if(hhFilter==="win")L=L.filter(x=>x.H.net>0).sort((a,b)=>b.H.net-a.H.net).slice(0,30);
  else if(hhFilter==="limp")L=L.filter(x=>x.A.limp);

  else if(hhFilter==="river")L=L.filter(x=>x.A.flags.includes("riverWeakCall"));
  else if(hhFilter==="beat")L=L.filter(x=>x.A.flags.includes("badBeat"));
  else if(hhFilter==="pfr")L=L.filter(x=>x.A.vpip&&!x.A.pfr);

        const vs=villains.filter(n=>!H.actions.some(b=>b.who===n&&b.verb==="folds"&&H.actions.indexOf(b)<H.actions.indexOf(a))).map(n=>H.shows[n]);
        if(vs.length){let eq;const nb=a.board.length;
          if(vs.length===1){const r=equity(H.hero,a.board,[[...vs[0],1]],nb>=4?0:5000);eq=(r.w+r.t/2)/r.n}else eq=equityMulti(H.hero,a.board,vs.map(v=>[[...v,1]]),5000).eq;
          extra+=` <span class="note">事後睇對手真牌：你得 ${pct(eq)}</span>`}
        if(st>0)extra+=` <span class="note">你：${TIER_NAME[tierOf(H.hero,a.board)]}</span>`}
      const amt=a.amt?` ₮${a.amt.toFixed(2)}`:"";
      if(a.who==="Hero"&&st>0&&a.kind==="bets")extra+=sizingHTML(sizingEval(H,H.actions.indexOf(a)));
      if(a.who==="Hero"&&st>0&&a.kind==="raises"&&!a.allin)extra+=` <span class="note ${a.to/((a.to-a.amt)+a.toCall)<2.5?"no":""}">raise 到對手注碼嘅 ${(a.to/((a.to-a.amt)+a.toCall)).toFixed(1)} 倍</span>`;
      h+=`<li class="${a.who==="Hero"?"me":""}">${name(a.who)} ${a.allin?"<b>all in</b>":VERB_NAME[a.kind]||a.verb}${a.kind==="raises"&&!a.allin?` 到 ₮${a.to.toFixed(2)}`:amt}${a.kind==="bets"&&st>0?`（${Math.round(a.amt/a.potBefore*100)}% pot）`:""}${extra}</li>`}
    h+=`</ol></div>`}
  if(villains.length)h+=`<div class="msg">攤牌：${villains.map(n=>`${name(n)} ${H.shows[n].map(miniCard).join("")}`).join("　")}</div>`;
  if(A.allin){const x=A.allin;
    h+=`<dl class="kv"><dt>All-in 時（${HH_SEC[x.street]}）你嘅 equity</dt><dd>${pct(x.eq)}</dd><dt>按 equity 應得</dt><dd>${sgn(x.ev)}</dd><dt>實際</dt><dd>${sgn(H.net)}</dd><dt>運氣</dt><dd class="${x.luck>=0?"pos":"neg"}">${sgn(x.luck)}</dd></dl>`;
    if(x.street===3)h+=`<div class="msg">River 先 all in，冇牌再發，結果完全取決於決定本身，唔關運氣。</div>`}
  return h}
/* load a hand's decision into the calculator */
function vilGuide(H,n){
  const pre=H.actions.filter(a=>a.street===0),pos=H.pos[n]||"BB";
  const raisers=pre.filter(a=>a.kind==="raises");
  const myRaise=raisers.findIndex(a=>a.who===n);
  let act,vs;
  if(myRaise===0)act="open";
  else if(myRaise===1){act="threebet";vs=H.pos[raisers[0].who]}
  else if(myRaise>=2)act="fourbet";
  else if(raisers.length){const firstIdx=pre.indexOf(raisers[0]);const called=pre.some((a,k)=>k>firstIdx&&a.who===n&&a.kind==="calls");
    if(called){act=raisers.length>=2?"call3b":"call";vs=H.pos[raisers[0].who]}}
  if(!act){if(pos==="BB")return{custom:true};act="limp"}
  return{pos,act,vs}}
function vilPost(H,n,st,heroIdx){
  const post={3:null,4:null,5:null};
  for(let s=1;s<=st;s++){
    const acts=H.actions.filter((a,k)=>a.street===s&&a.who===n&&(s<st||k<heroIdx));if(!acts.length)continue;
    const a=acts[acts.length-1],L=[0,3,4,5][s],base=Math.max(.01,a.potBefore-a.toCall);
    if(a.kind==="raises")post[L]="raise";
    else if(a.kind==="bets")post[L]=a.amt/a.potBefore>=.66?"big":"small";
    else if(a.kind==="calls")post[L]=a.toCall/base>=.66?"callB":"callS";
    else if(a.verb==="checks")post[L]="check"}
  return post}
function hhVillainOpps(H,st,heroIdx){
  const live=Object.keys(H.pos).filter(n=>n!=="Hero"&&!H.actions.some((a,k)=>k<heroIdx&&a.who===n&&a.verb==="folds")&&H.actions.some(a=>a.who===n&&a.street===st||a.who===n&&a.street<st&&a.street>=0)).slice(0,5);
  return (live.length?live:["?"]).map(n=>{const g=vilGuide(H,n);let o;
    if(g.custom){o=newOpp("BB","call","BTN");o.guide.custom=true;o.range=topPct(100)}else o=newOpp(g.pos,g.act,g.vs);
    o.post=vilPost(H,n,st,heroIdx);return o})}
function sizingEval(H,idx){
  const a=H.actions[idx],opps=hhVillainOpps(H,a.street,idx),dead=new Set([...H.hero,...a.board]);
  const lists=opps.map(o=>combosFor(o,a.board,dead).filter(c=>c[2]>.001));if(lists.some(l=>!l.length))return null;
  const multi=lists.length>1,r=multi?equityMulti(H.hero,a.board,lists,4000):equity(H.hero,a.board,lists[0],4000),eqNow=multi?r.eq:(r.w+r.t/2)/r.n;
  const pot=a.potBefore,guides=opps.map(o=>o.guide);
  const rows=SIZES.map(f=>({f,...betEval(H.hero,a.board,lists,guides,pot,pot*f,eqNow,3000)}));
  const mine={f:a.amt/pot,...betEval(H.hero,a.board,lists,guides,pot,a.amt,eqNow,3000)};
  const best=rows.reduce((x,y)=>y.evBet>x.evBet?y:x);
  return{mine,best,evCheck:eqNow*pot,pot}}
function sizingHTML(z){
  if(!z)return"";const {mine,best,evCheck,pot}=z,sg=v=>(v>=0?"+":"−")+"₮"+Math.abs(v).toFixed(2);
  let verdict,cls;
  if(Math.max(best.evBet,mine.evBet)<evCheck-.03*pot){verdict="模型覺得 check 好過 bet";cls="no"}
  else if(mine.evBet<evCheck+.03*pot&&best.evBet<evCheck+.03*pot){verdict="Bet 同 check 差唔多";cls=""}
  else if(best.evBet-mine.evBet<=.05*pot){verdict="注碼合理";cls="ok"}
  else{verdict=best.f>mine.f?`可以落大啲（${sizeName(best.f)} pot）`:`可以落細啲（${sizeName(best.f)} pot）`;cls="no"}
  return `<div class="sizing"><span class="note ${cls}">${verdict}</span> 你落 ${Math.round(mine.f*100)}% pot，模型估 EV ${sg(mine.evBet)}；最好係 ${sizeName(best.f)}（${sg(best.evBet)}）；check ${sg(evCheck)}。對手 fold 機會：你嘅大小 ${pct(mine.FE)}。</div>`}
function hhOpen(i,st){
  const {H}=HH[i];const mine=H.actions.map((a,k)=>[a,k]).filter(([a])=>a.street===st&&a.who==="Hero");
  const pickA=[...mine].reverse().find(([a])=>a.toCall>0)||mine[0];const heroIdx=pickA[1],ha=pickA[0];
  slots=[H.hero[0],H.hero[1],null,null,null,null,null];ha.board.forEach((c,k)=>slots[2+k]=c);active=Math.min(6,2+ha.board.length);

  renderSlots();setMain("calc");showSec("bet");schedule();window.scrollTo(0,0);
}

/* ===== curriculum: 5 levels, beginner → professional ===== */
const T=(head,rows)=>`<div class="tbl"><table class="sz"><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const LEVELS=[
{lv:1,name:"新手",goal:"識規則、打得穩，唔再犯大錯",lessons:[
{id:"rules",t:"手牌大細同基本規則",h:`
<p>由大到細：同花順 → 四條 → 葫蘆 → 同花 → 順子 → 三條 → 兩對 → 一對 → 高牌。</p>
<ul><li>用 7 張牌（2 張手牌＋5 張公共牌）揀最好嘅 5 張。</li>
<li><b>Kicker</b>：大家都係一對 A，就比第二大嗰張。A-K 贏 A-Q。</li>
<li>A 可以做最大（10-J-Q-K-A），亦可以做最細（A-2-3-4-5）。</li>
<li>公共牌已經係最好嘅 5 張，大家就平分（split pot）。</li></ul>`},
{id:"position",t:"位置",go:[["練習 preflop 題","quiz"]],h:`
<p>6 人枱 preflop 出聲次序：UTG → MP → CO → BTN → SB → BB。Flop 之後 SB、BB 先講，BTN 最後。</p>
<ul><li><b>越後出聲越著數</b>：睇晒其他人做咩先決定，所以可以玩多啲牌。BTN 可以 open 大約 45%，UTG 只有 17% 左右。</li>
<li><b>盲注冇位置</b>：flop 之後要先講，所以要用好啲嘅牌先入池；BB 已經落咗 1bb，可以防守闊啲。</li></ul>`},
{id:"equity",t:"Equity 同 pot odds",go:[["去「注碼」計 call 定 fold","calc:bet"],["練習估 equity","quiz"]],h:`
<p><b>Equity</b>：如果而家直接發晒啲牌，你贏嘅機會有幾大。<b>Pot odds</b>：call 要嘅 equity ＝ 要跟嘅錢 ÷（跟完之後個 pot）。</p>
${T(["對手落注","你要嘅 equity"],[["1/3 pot","20%"],["1/2 pot","25%"],["3/4 pot","30%"],["1 個 pot","33%"],["2 個 pot","40%"]])}
<p><b>2 同 4 法則</b>：outs × 4% ≈ flop 睇到 river；outs × 2% ≈ 只睇下一張。</p>
${T(["Draw","Outs","Flop→River","下一張"],[["同花 draw","9","35%","19%"],["兩頭順 draw","8","31%","17%"],["兩張高張","6","24%","13%"],["卡窿順","4","16%","9%"]])}`},
{id:"range",t:"咩係 range",go:[["去「對手」揀 range","calc:opp"]],h:`
<p>你睇唔到對手張牌，所以要估佢<b>可能有嘅所有手牌</b>，呢堆就係 range。</p>
<ul><li>13×13 格：斜對角係 pair，右上係同花（s），左下係唔同花（o）。</li>
<li>組合數：pair 6 個、同花 4 個、唔同花 12 個，總共 1326 個。AKo 出現機會係 AKs 嘅 3 倍。</li>
<li><b>Blocker</b>：你手上或者枱面有嘅牌，對手就冇可能有。</li></ul>`},
{id:"open",t:"第一個入池：raise 或者 fold",go:[["去「注碼」睇 preflop 建議","calc:bet"],["練習 preflop 題","quiz"]],h:`
<p>前面全部 fold 到你，<b>只有 raise 或者 fold，唔好 limp</b>。大細 2.5bb，SB 用 3bb。</p>
${T(["位置","大約 open"],[["UTG","17%"],["MP","22%"],["CO","29%"],["BTN","45%"],["SB","38%"]])}
<p>Raise 有機會即刻贏盲注，好牌又可以贏大 pot；limp 就俾人平平地入池，或者俾人 raise 迫你放棄。</p>`},
{id:"limp",t:"面對 limp",go:[["去「注碼」揀「有人 limp」","calc:bet"]],h:`
<ul><li><b>好牌加注孤立佢</b>：3bb＋每個 limp 加 1bb，冇位置再加 1bb。</li>
<li><b>細 pair、同花連張</b>可以跟住 limp，博中 set 或者大牌。</li><li>其他弱牌 fold。BB 冇人 raise 就 check。</li></ul>`},
{id:"tilt",t:"Tilt 同停損",h:`
<ul><li>輸咗大 pot、俾人追中之後，最容易越打越想追返，即係 tilt。</li>
<li>定停損線，例如一日輸 3 個 buy-in 就停。夜深、攰、飲咗酒都唔好打。</li>
<li>輸咗去「紀錄」睇 all-in 運氣：決定冇錯就係運氣，唔使改打法。</li></ul>`},
{id:"bankroll",t:"資金管理",h:`
<ul><li>Cash game 一般建議至少有 20–40 個 buy-in 先打嗰個級別。</li>
<li>輸到唔夠就降返細一級，唔好加注碼追數。只用輸得起嘅錢打。</li></ul>`},
{id:"rules2",t:"平台規則",h:`
<p>所有網上平台都禁止打牌期間用即時輔助工具（包括計 equity、睇 range 表），捉到會封 account、沒收餘額，對其他玩家亦唔公平。呢個 app 係用嚟<b>打完之後 review 同練習</b>。</p>`},
{id:"howto",t:"建議嘅練習流程",go:[["去「紀錄」匯入","hh"],["去「練習」","quiz"]],h:`
<ol><li>打完一個 session，喺 CoinPoker 匯出手牌紀錄。</li><li>去「紀錄」匯入，睇「主要問題」同累積輸贏圖。</li>
<li>撳入有問題嘅手牌，睇每條街分析；撳「去計算頁分析」自己試。</li><li>去「練習」做題，將知識變成直覺。</li>
<li>每隔幾日匯入新紀錄，紀錄會累積。</li></ol>`}]},

{lv:2,name:"微注贏家",goal:"穩定打贏娛樂型玩家",lessons:[
{id:"vsraise",t:"面對 raise：3-bet、call 定 fold",go:[["去「注碼」揀「有人 raise」","calc:bet"]],h:`
<ul><li><b>3-bet 大細</b>：有位置 3 倍、冇位置 4 倍對手注碼；前面每多一個人 call 再加 1 倍。</li>
<li><b>3-bet 用</b>強牌（TT+、AQ+）加少量 bluff（A5s、A4s）。</li>
<li><b>Call 要睇對手位置</b>：CO call UTG 只有大約 8%，BB call BTN 可以去到 40%。對手開到 4bb 以上要收緊。</li></ul>`},
{id:"3bet4bet",t:"被 3-bet、被 4-bet",go:[["去「注碼」揀情況","calc:bet"]],h:`
<p><b>Open 後被 3-bet</b>：4-bet 用 QQ+、AK、少量 A5s（大約 2.2–2.5 倍）；JJ–88、AQ、同花大牌 call；其他 fold。</p>
<p><b>3-bet 後被 4-bet</b>：微注枱多數係 QQ+、AK。100bb 嘅話 QQ+、AK all in；JJ、TT、AQs call；其他 fold。</p>`},
{id:"cbet",t:"C-bet 基礎",h:`
<p>Preflop 你 raise、對手 call，flop 你繼續落注就係 c-bet（continuation bet）。</p>
<ul><li><b>單挑、有位置、乾牌面</b>（例如 K-7-2 唔同花）：可以經常細注 c-bet（25–33% pot），因為呢啲牌面你嘅 range 有利。</li>
<li><b>濕牌面</b>（例如 9-8-7 兩隻同花）：對手 call 嘅牌好多都中咗，要 check 多啲，有牌先落大啲。</li>
<li><b>多人底池</b>：c-bet 要少好多，冇牌就 check。</li>
<li>俾人 call 咗 flop，turn 冇改善又冇 draw，通常就放棄。</li></ul>`},
{id:"thinvalue",t:"Value bet：微注枱最賺錢嘅技巧",go:[["去「紀錄」睇注碼習慣","hh"]],h:`
<p>微注枱對手 call 得太多、bluff 得太少。贏錢最主要靠 <b>value bet</b>：有牌就落注，等差過你嘅牌 call 你。</p>
<ul><li>Top pair 好 kicker、overpair 喺大部分牌面都應該連續落三條街。</li>
<li>River 有中強牌、對手係 calling station，可以「薄」啲 value bet：佢會用更差嘅 pair call。</li>
<li>問自己：如果我落注，佢有冇比我差嘅牌會 call？有就落。</li></ul>`},
{id:"setmine",t:"細 pair、implied odds 同 set mining",h:`
<p>細 pair 中 set 嘅機會大約 12%（約 8 次中 1 次）。所以用細 pair call 一個 raise，主要靠中 set 之後贏對手大量籌碼，即係 <b>implied odds</b>。</p>
<ul><li>經驗法則：雙方有效籌碼至少係你 call 嘅 15–20 倍，先值得用細 pair set mine。</li>
<li>對手籌碼短、或者 raise 好大，就 fold 細 pair。</li>
<li>冇中 set 又面對落注，通常 fold，唔好用 underpair 硬撐。</li></ul>`},
{id:"narrow",t:"跟住對手動作收窄 range",go:[["去「對手」揀每條街動作","calc:opp"]],h:`
${T(["對手做咗","佢 range 會點變"],[["Check","最強嘅牌少咗"],["Call 細注","有 pair、draw、甚至高張"],["Call 大注","多數 top pair 以上同強 draw"],["細注 bet","好闊，有價值牌亦有 bluff"],["大注 bet","多數強牌或者強 draw"],["Raise","最強訊號，set、兩對以上為主"]])}`},
{id:"sizing",t:"注碼大細",go:[["去「紀錄」睇你嘅注碼習慣","hh"]],h:`
<ul><li><b>強牌落大啲</b>：50–100% pot。微注枱對手鍾意 call，唔好落細注慳佢。</li>
<li><b>中等牌</b>：check 或者細注，落大注只會趕走差過你嘅牌。</li>
<li><b>Bluff 同 value 用相近大細</b>，唔好俾對手睇注碼就知你有冇嘢。</li>
<li><b>Raise 至少 2.5 倍</b>對手注碼。</li></ul>`},
{id:"bluff",t:"Bluff 同 fold equity",go:[["去「注碼」睇 bet 大細表","calc:bet"]],h:`
<p>純 bluff 要對手 fold 幾多先唔蝕 ＝ 你落嘅注 ÷（pot＋你落嘅注）。</p>
${T(["你落","對手要 fold"],[["1/3 pot","25%"],["1/2 pot","33%"],["3/4 pot","43%"],["1 個 pot","50%"]])}
<ul><li><b>半 bluff 最好</b>：有 draw 先 bluff，俾人 call 都仲有機會中。</li><li><b>唔好 bluff calling station</b>。</li></ul>`},
{id:"river",t:"River 大注同 raise",go:[["去「紀錄」揀「Call 咗但 equity 唔夠」","hh"]],h:`
<p>微注枱 river 好少 bluff。對手 river 落大注、all in 或者 raise，大部分係真牌。得一對、或者俾牌面拖累嘅兩對，要捨得 fold。</p>
<p>例：你 9♠8♦ 喺 A 高牌面，對手 check-raise、turn 再落、river all in，你中 pair call 落去輸 ₮25；按佢 range 你只有大約 6% equity。</p>`},
{id:"multi",t:"多人底池",go:[["去「對手」加對手","calc:opp"]],h:`
<ul><li>要同時贏晒所有人：AA 對 KK 有 81%，加多個 QQ 就跌到大約 67%。</li>
<li>多人底池用更強嘅牌先入錢，bluff 少好多；top pair 喺 4 人底池可能只係中等。</li></ul>`},
{id:"variance",t:"EV、運氣同樣本",go:[["去「紀錄」睇 all-in 運氣","hh"]],h:`
<ul><li>好嘅決定係 EV 正，唔係「今次贏咗」。80% 贏面每 5 次都會輸 1 次。</li>
<li><b>All-in EV</b>：按入錢嗰刻 equity 計應得幾多，實際同應得嘅差距就係運氣。</li>
<li>幾百手樣本運氣主宰結果，要幾萬手先睇得清真實水平。</li></ul>`},
{id:"stats",t:"讀懂自己嘅數據",go:[["去「紀錄」睇你嘅數據","hh"]],h:`
${T(["指標","意思","6-max 參考"],[["VPIP","主動入池嘅比率","22–28%"],["PFR","Preflop raise 嘅比率","18–22%"],["3-bet","面對 open 時 3-bet","6–9%"],["Fold to c-bet","面對 c-bet fold","40–55%"],["WTSD","睇到 flop 後去到攤牌","25–30%"],["W$SD","攤牌贏嘅比率","50%+"]])}
<p>VPIP 同 PFR 差距大（例如 50% 對 1%）代表你 call 得太多、raise 得太少，係微注最常見嘅漏洞。</p>`}]},

{lv:3,name:"中級",goal:"打贏常規玩家，開始用 range 思考",lessons:[
{id:"texture",t:"牌面結構同 range 優勢",h:`
<ul><li><b>乾牌面</b>（K-7-2 唔同花）：好少 draw，牌力比較固定。</li><li><b>濕牌面</b>（J-T-9 兩隻同花）：好多 draw，牌力隨時變。</li>
<li><b>Range 優勢</b>：邊個 range 喺呢個牌面平均強啲。Preflop raise 嘅人喺 A、K 高牌面通常有優勢；BB call 嘅人喺 6-5-4 呢類細牌面有優勢。</li>
<li><b>Nut 優勢</b>：邊個 range 有多啲最強嘅牌。有 nut 優勢嘅一方可以落大注甚至 overbet。</li></ul>
<p>決定之前先問：呢個牌面幫邊個？</p>`},
{id:"polar",t:"Polarized 同 linear range",h:`
<ul><li><b>Polarized（兩極化）</b>：只有好強同好弱（bluff），冇中間。大注、overbet、river raise 通常係 polarized。</li>
<li><b>Linear（線性）</b>：由最強一路落到中等，冇純 bluff。細注、preflop 對住鬆嘅玩家 3-bet 通常係 linear。</li>
<li>大注配 polarized range，細注配 linear／merged range。</li></ul>`},
{id:"mdf",t:"最少防守頻率（MDF）",h:`
<p>對手落注，你要繼續（call 或者 raise）幾多先唔會俾佢任何兩張牌 bluff 都有錢賺：MDF ＝ pot ÷（pot＋注）。</p>
${T(["對手落","你最少要繼續"],[["1/3 pot","75%"],["1/2 pot","67%"],["3/4 pot","57%"],["1 個 pot","50%"],["2 個 pot","33%"]])}
<p>呢個係理論底線。微注枱對手少 bluff，實際可以 fold 多過 MDF；但如果你成日 fold，識打嘅人就會不停 bluff 你。</p>`},
{id:"blockers",t:"用 blocker 揀 bluff",h:`
<ul><li>揀 bluff 嘅牌，最好擋住對手最強嘅牌、但唔擋佢會 fold 嘅牌。</li>
<li>例：同花牌面 river，你手上有 A♠（同花最大張），對手冇可能有 nut flush，用嚟 bluff raise 會更有效。</li>
<li>Preflop 用 A5s 3-bet bluff，因為 A 擋住對手 AA、AK。</li></ul>`},
{id:"spr",t:"SPR 同籌碼深度",h:`
<p><b>SPR</b> ＝ flop 時有效籌碼 ÷ pot。</p>
${T(["SPR","意思"],[["少過 3","Top pair 已經可以全入"],["4–8","Top pair 要小心，兩對以上先好舒服"],["多過 10","要好強嘅牌先值得全入，implied odds 牌更有價值"]])}
<p>籌碼越深，細 pair、同花連張越值錢；籌碼越短，大牌越值錢。</p>`},
{id:"plan",t:"成手牌嘅計劃",h:`
<ul><li>Flop 落注之前，諗定 turn、river 會點：邊啲牌繼續落、邊啲牌放棄。</li>
<li>計清楚：如果三條街都落 2/3 pot，最後會唔會全入？夠唔夠牌力？</li>
<li>Draw 就揀好邊張 turn 牌繼續 semi-bluff（例如中 draw 或者多咗 outs 嘅牌）。</li></ul>`},
{id:"exploit",t:"針對唔同類型對手",go:[["去「對手」設定 Bluff／Fold 傾向","calc:opp"]],h:`
${T(["類型","特徵","點對付"],[["Calling station","乜都 call","唔好 bluff，有牌就大注 value"],["Nit（好緊）","只玩大牌","佢落注就 fold，多啲偷盲"],["鬆兇（LAG）","成日 raise","用強牌 call 落去或者 3-bet，唔好亂 bluff"],["緊兇（TAG）","常規玩家","接近 GTO 打法，搵佢 fold 太多嘅位"]])}`},
{id:"gto",t:"GTO 同 exploit",h:`
<ul><li><b>GTO</b>：理論上冇人可以佔你便宜嘅打法，係一個基準。</li>
<li><b>Exploit</b>：針對對手弱點調整。微注枱：多 value bet、少 bluff、尊重 river 大注同 raise。</li>
<li>先學識 GTO 大方向，再按對手偏離佢。</li></ul>`}]},

{lv:4,name:"高級",goal:"用 solver 讀書，打中級別",lessons:[
{id:"mixed",t:"混合策略同頻率",h:`
<p>Solver 好多時會話同一手牌「40% bet、60% check」。原因係如果你每次都一樣，對手就可以針對你。</p>
<ul><li>實戰簡化：揀主要嘅動作，或者用隨機方法（例如睇手錶秒數）決定。</li>
<li>重點唔係記晒頻率，而係明白點解呢手牌兩樣都得。</li></ul>`},
{id:"overbet",t:"Overbet 同大注",h:`
<ul><li>當你有 <b>nut 優勢</b>（你 range 有好多最強嘅牌，對手好少），可以落多過 pot 嘅注。</li>
<li>Overbet 嘅 range 一定係 polarized：nuts 加 bluff。</li>
<li>常見位置：turn 出咗一張幫你 range 嘅牌，例如你 preflop 3-bet，turn 出 A。</li></ul>`},
{id:"lines",t:"Check-raise、delayed c-bet、probe",h:`
<ul><li><b>Check-raise</b>：冇位置嘅一方用強牌同強 draw 反擊 c-bet。濕牌面頻率高啲。</li>
<li><b>Delayed c-bet</b>：flop check 過，turn 先落注，代表你 flop 想控制 pot 或者 turn 改善咗。</li>
<li><b>Probe bet</b>：對手 flop 冇 c-bet，你 turn 主動落注，因為佢 range 示弱。</li></ul>`},
{id:"3betpot",t:"3-bet pot 同 4-bet pot",h:`
<ul><li>SPR 細好多（大約 3–4），top pair 好多時已經可以全入。</li>
<li>3-bet 嘅人喺高牌面有 range 優勢，可以細注頻繁 c-bet。</li>
<li>Call 3-bet 嘅人要喺細牌面、連牌面更積極。</li></ul>`},
{id:"icm",t:"錦標賽同 ICM 基礎",h:`
<ul><li>錦標賽嘅籌碼唔等於錢：輸晒就出局，贏多咗籌碼價值增加得少。</li>
<li><b>ICM</b> 將籌碼換算做獎金價值。接近錢圈或者決賽枱，要比 cash game 更緊咁 call all in。</li>
<li>短籌碼（15bb 以下）用 push／fold 表。</li></ul>`},
{id:"solver",t:"點樣用 solver 讀書",h:`
<ol><li>喺自己嘅紀錄揀常見又輸錢嘅情況（例如 BTN 對 BB 單挑 c-bet）。</li>
<li>用 solver 睇整體策略（aggregate report），學大方向：幾時 bet、bet 幾大。</li>
<li>再睇具體手牌，問「點解」，唔好死記。</li>
<li>Node locking：設定對手有某種漏洞（例如 fold 太多），睇最佳策略點變，就係 exploit 嘅方法。</li>
<li>每星期定時 review，同讀書小組討論。</li></ol>`}]},

{lv:5,name:"職業",goal:"將撲克當職業嘅現實要求",lessons:[
{id:"volume",t:"手數、勝率同 variance",h:`
<ul><li>6-max 嘅標準差大約每 100 手 80–100bb。即係就算你係贏家，輸 20–30 個 buy-in 嘅 downswing 都好正常。</li>
<li>要大約 10 萬手以上，先可以比較有信心咁講自己係贏家。</li>
<li>贏家勝率通常大約每 100 手 2–8bb，級別越高越低。</li></ul>`},
{id:"probank",t:"職業資金管理",h:`
<ul><li>職業玩家一般預留 50–100 個 buy-in 嘅打牌資金。</li>
<li>另外要有 6–12 個月生活費，唔好同打牌資金混埋。</li>
<li>Rakeback、rake 高低對收入影響好大，揀平台同級別要計埋。</li></ul>`},
{id:"system",t:"學習同工作系統",h:`
<ul><li>常見分配：大約 70% 時間打牌、30% 讀書同 review。</li>
<li>每個 session 之後 review 大 pot 同標記咗嘅手牌；每星期分析一次資料庫，搵最大嘅漏洞。</li>
<li>搵教練或者讀書小組，旁觀者睇到你自己睇唔到嘅錯。</li></ul>`},
{id:"agame",t:"表現管理",h:`
<ul><li>分清你嘅 A-game、B-game、C-game，C-game 出現就停。</li>
<li>瞓覺、運動、飲食直接影響決定質素。</li>
<li>揀枱：同弱嘅玩家打先係最大嘅收入來源。</li></ul>`},
{id:"reality",t:"轉職業之前嘅現實",h:`
<ul><li>大部分玩家長期都係輸家，能夠靠撲克維生嘅只係少數。</li>
<li>考慮轉職業之前，最好有大量樣本（幾十萬手）證明你喺目標級別穩定贏錢，同時有足夠資金同生活費。</li>
<li>保留正職、當業餘高手，通常係更穩陣嘅選擇。</li></ul>`}]}
];
let readSet=new Set();try{readSet=new Set(JSON.parse(localStorage.getItem("eqlab-read")||"[]"))}catch(e){}
let curLv=1;try{curLv=+localStorage.getItem("eqlab-lv")||1}catch(e){}
/* milestones measured from the user's own records */
function learnCtx(){
  const c={n:HH.length,quizN:stats.n,quizAcc:stats.n?stats.c/stats.n:0};
  if(HH.length){const S=summarise(HH);simulateAll(HH);c.S=S;
    c.vpip=S.nonBomb?S.vpip/S.nonBomb:0;c.pfr=S.nonBomb?S.pfr/S.nonBomb:0;c.limp=S.hands?S.limp/S.hands:0;
    c.adj=HH.reduce((a,x)=>a+(x.A.allin&&x.A.allin.street<3?x.A.allin.ev:x.H.net)/x.H.bb,0)/HH.length*100;
    c.badCall=S.dec.call?S.dec.callBad/S.dec.call:0}
  return c}
const P0=x=>Math.round(x*100)+"%";
const MILESTONES={
 1:[["讀晒新手課程",c=>({v:`${LEVELS[0].lessons.filter(l=>readSet.has(l.id)).length}／${LEVELS[0].lessons.length}`,ok:LEVELS[0].lessons.every(l=>readSet.has(l.id))})],
    ["第一個入池唔 limp（≤2% 手牌）",c=>c.n?{v:P0(c.limp),ok:c.limp<=.02}:null],
    ["VPIP 18–30%",c=>c.n?{v:P0(c.vpip),ok:c.vpip>=.18&&c.vpip<=.3}:null],
    ["PFR 12% 以上",c=>c.n?{v:P0(c.pfr),ok:c.pfr>=.12}:null],
    ["練習 50 題以上，正確率 80%+",c=>({v:`${c.quizN} 題 · ${P0(c.quizAcc)}`,ok:c.quizN>=50&&c.quizAcc>=.8})]],
 2:[["累積 5 萬手紀錄",c=>({v:c.n.toLocaleString(),ok:c.n>=50000})],
    ["扣除運氣後 bb/100 ≥ 0",c=>c.n?{v:c.adj.toFixed(1),ok:c.adj>=0}:null],
    ["Call 咗但 equity 唔夠 ≤ 10%",c=>c.n&&c.S.dec.call?{v:P0(c.badCall),ok:c.badCall<=.1}:null],
    ["PFR ÷ VPIP ≥ 0.7",c=>c.n&&c.vpip?{v:(c.pfr/c.vpip).toFixed(2),ok:c.pfr/c.vpip>=.7}:null]],
 3:[["累積 10 萬手",c=>({v:c.n.toLocaleString(),ok:c.n>=100000})],["扣除運氣後 bb/100 ≥ 3",c=>c.n?{v:c.adj.toFixed(1),ok:c.adj>=3}:null]],
 4:[["累積 20 萬手，喺 NL50 或以上",c=>({v:c.n.toLocaleString(),ok:false})],["每星期 solver review",()=>null],["有教練或者讀書小組",()=>null]],
 5:[["幾十萬手樣本證明穩定贏錢",()=>null],["50–100 個 buy-in 資金＋6–12 個月生活費",()=>null]]};
function renderLearn(){
  const L=LEVELS.find(x=>x.lv===curLv)||LEVELS[0],c=learnCtx();
  const all=LEVELS.flatMap(x=>x.lessons);
  $("learnProg").textContent=`已讀 ${all.filter(l=>readSet.has(l.id)).length}／${all.length}`;
  $("lvTabs").innerHTML=LEVELS.map(x=>{const r=x.lessons.filter(l=>readSet.has(l.id)).length;
    return `<button class="lvb" data-lv="${x.lv}" aria-pressed="${x.lv===curLv}"><b>Lv${x.lv}</b><span>${x.name}</span><i>${r}/${x.lessons.length}</i></button>`}).join("");
  const ms=MILESTONES[L.lv].map(([t,f])=>{const r=f(c);return `<li class="${r&&r.ok?"ok":""}"><span>${r&&r.ok?"✓":"○"} ${t}</span><b>${r?r.v:"自己評估"}</b></li>`}).join("");
  $("learnList").innerHTML=`<div class="panel"><div class="label">Level ${L.lv}・${L.name}</div><div class="lvgoal">${L.goal}</div>
    <div class="label" style="margin-top:4px">升級條件 <span>${c.n?`按你 ${c.n} 手紀錄`:"匯入紀錄後自動計"}</span></div><ul class="ms">${ms}</ul></div>
  <div class="panel"><div class="lessons">${L.lessons.map(l=>`
    <details class="lesson" data-id="${l.id}"><summary><span class="ltitle">${l.t}</span>${readSet.has(l.id)?'<span class="done">已讀</span>':""}</summary>
    <div class="lbody">${l.h}${l.go?`<div class="row">${l.go.map(([n,g])=>`<button class="cb" data-go="${g}">${n}</button>`).join("")}</div>`:""}
    <button class="btn" data-read="${l.id}">${readSet.has(l.id)?"標記為未讀":"標記為已讀"}</button></div></details>`).join("")}</div></div>`;
}
$("lvTabs").addEventListener("click",e=>{const b=e.target.closest("[data-lv]");if(!b)return;curLv=+b.dataset.lv;try{localStorage.setItem("eqlab-lv",curLv)}catch(err){}renderLearn()});
$("learnList").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){const [m,s]=g.dataset.go.split(":");setMain(m);if(s)showSec(s);window.scrollTo(0,0);return}
  const r=e.target.closest("[data-read]");if(r){const id=r.dataset.read;readSet.has(id)?readSet.delete(id):readSet.add(id);
    try{localStorage.setItem("eqlab-read",JSON.stringify([...readSet]))}catch(err){}
    renderLearn();const d=document.querySelector(`.lesson[data-id="${id}"]`);if(d)d.open=true}});

buildPicker();loadSample();renderStats();renderLearn();
try{const t=localStorage.getItem("eqlab-hh");if(t)hhLoad(t,false)}catch(e){}
try{const sec=localStorage.getItem("eqlab-sec");if(sec&&["cards","opp","bet"].includes(sec))showSec(sec)}catch(e){}
</script>
